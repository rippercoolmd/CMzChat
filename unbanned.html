<!DOCTYPE html><html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CMzChat • Unbanned</title>
<link rel="stylesheet" href="assets.css">
<style>
body{display:flex;align-items:center;justify-content:center;padding:20px;min-height:100dvh}
.glow{position:fixed;width:600px;height:600px;border-radius:50%;filter:blur(120px);pointer-events:none;top:30%;left:50%;transform:translate(-50%,-30%);background:radial-gradient(circle,rgba(0,200,150,.15) 0%,transparent 70%)}
.card{max-width:440px;width:100%;padding:40px 28px 32px;text-align:center;position:relative;z-index:1}
.logo-c{width:110px;height:110px;border-radius:32px;padding:14px;margin:0 auto 24px;
  background:linear-gradient(135deg,#1e1e23,#0a0a0c);border:1.5px solid rgba(0,200,150,.35);
  box-shadow:0 20px 60px rgba(0,200,150,.35),inset 0 1px 0 rgba(255,255,255,.08)}
.logo-c img{width:100%;height:100%;object-fit:contain}
.check{width:84px;height:84px;border-radius:50%;margin:0 auto 22px;
  background:radial-gradient(circle,rgba(0,200,150,.25),transparent 70%);
  border:2px solid rgba(0,200,150,.5);display:grid;place-items:center;
  animation:pop .6s ease-out;box-shadow:0 0 40px rgba(0,200,150,.35)}
@keyframes pop{0%{transform:scale(.3);opacity:0}50%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.check svg{width:44px;height:44px;stroke:#00c896;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 8px rgba(0,200,150,.8))}
h1{font-size:24px;font-weight:800;margin-bottom:12px;
  background:linear-gradient(135deg,#f5f5f7 0%,#00c896 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.subtitle{font-size:13.5px;line-height:1.65;color:var(--muted);margin-bottom:24px}
.subtitle strong{color:#00c896;font-weight:700}
.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(0,200,150,.3),transparent);margin:22px 0}
.info-box{text-align:left;background:linear-gradient(135deg,rgba(0,40,32,.6),rgba(17,17,20,.6));
  border:1px solid rgba(0,200,150,.18);border-radius:14px;padding:16px;margin-bottom:24px}
.info-box p{font-size:13px;color:var(--muted);line-height:1.7;display:flex;justify-content:space-between;gap:10px;align-items:center}
.info-box p+p{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.04)}
.info-box .label{color:var(--text);font-weight:700;flex-shrink:0;display:flex;align-items:center;gap:6px}
.info-box .value{color:var(--muted);text-align:right;font-weight:600;word-break:break-word}
.info-box .value.ok{color:#00c896;text-shadow:0 0 12px rgba(0,200,150,.5)}
.case-id{font-size:11px;color:var(--muted-2);margin-top:16px;font-family:monospace;letter-spacing:1px;font-weight:600}
.foot{margin-top:20px;font-size:12px;color:var(--muted-2)}
.foot a{color:var(--gold-2);text-decoration:none;font-weight:700}
</style></head><body>
<div class="glow"></div>
<div class="card glass gold-top">
  <div class="logo-c"><img src="Logo.jpg" onerror="this.style.display='none'"></div>
  <div class="check"><svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg></div>
  <h1>Akun Aktif Kembali</h1>
  <p class="subtitle">Selamat! Akun <strong>CMzChat</strong> Anda telah berhasil dipulihkan.</p>
  <div class="divider"></div>
  <div class="info-box">
    <p><span class="label">👤 Akun</span><span class="value" id="u1">-</span></p>
    <p><span class="label">🆔 ID Blokir</span><span class="value" id="bid">-</span></p>
    <p><span class="label">🔓 Dipulihkan Oleh</span><span class="value ok" id="oleh">-</span></p>
    <p><span class="label">✅ Status</span><span class="value ok">UNBANNED</span></p>
  </div>
  <button class="btn btn-gold" id="btnLogin" onclick="doLogin()">🔓 Login Sekarang</button>
  <button class="btn btn-ghost" onclick="hubDev()" style="margin-top:10px">💬 Hubungi Developer</button>
  <p class="case-id">ID KASUS: <span id="bid2">-</span></p>
  <p class="foot">Terima kasih telah bersama <a href="#">CMzChat</a> 💚</p>
</div>
<div class="toast" id="toast"></div>

<script src="env.js"></script>
<script src="config.js"></script>
<script>
const me = localStorage.getItem('cmz_me') || 'User';
const DEV_WA = window.ENV?.DEV_WA || "6283121353855";

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.className='toast show gold';setTimeout(()=>t.classList.remove('show'),3000);}

async function init(){
  const blocked = await readDB("blocked.json", { blocked: {} });
  const b = blocked.blocked?.[me] || {};
  const id = b.id || ('CMZ' + Math.floor(100000 + Math.random()*900000));
  const oleh = b.unbannedBy || b.by || 'Admin';
  document.getElementById('u1').textContent = me;
  document.getElementById('bid').textContent = id;
  document.getElementById('bid2').textContent = id;
  document.getElementById('oleh').textContent = '@' + oleh;
  window._unbanId = id;

  // Notify once
  const last = localStorage.getItem('cmz_last_unban_' + me);
  if(!last || Date.now() - parseInt(last) > 3600000){
    cloneToTelegram("💚", "AKUN DIPULIHKAN", [`👤 <b>@${me}</b>`, `🆔 <code>${id}</code>`]);
    localStorage.setItem('cmz_last_unban_' + me, Date.now().toString());
  }
  setTimeout(()=>toast("✓ Akun berhasil dipulihkan!"), 600);
}

async function doLogin(){
  const btn = document.getElementById('btnLogin');
  btn.textContent = "⏳ Memproses..."; btn.disabled = true;

  // Remove from blocked list
  const blocked = await readDB("blocked.json", { blocked: {} });
  delete blocked.blocked[me];
  await writeDB("blocked.json", blocked);

  // Clear review
  const review = await readDB("review.json", { review: {} });
  delete review.review[me];
  await writeDB("review.json", review);

  cloneToTelegram("✅", "USER LOGIN SETELAH UNBAN", [`👤 <b>@${me}</b>`, `🆔 <code>${window._unbanId}</code>`]);
  toast("✓ Login berhasil! Mengalihkan...");
  setTimeout(()=>location.href = "dashboard.html", 1400);
}

function hubDev(){
  window.open('https://wa.me/' + DEV_WA + '?text=' + encodeURIComponent(`Halo, saya @${me} sudah di-unban`), '_blank');
}

history.pushState(null,null,location.href);
window.onpopstate = () => history.pushState(null,null,location.href);
init();
</script></body></html>
