<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CMzChat - Unbanned</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#0a2a22 0%,#0b141a 50%,#05080a 100%);padding:20px;color:#e9edef;font-family:-apple-system,'Segoe UI',Roboto,sans-serif}
.card{background:linear-gradient(180deg,rgba(17,27,33,.95),rgba(17,27,33,.85));backdrop-filter:blur(20px);border:1px solid rgba(6,207,156,.15);border-radius:24px;max-width:420px;width:100%;padding:40px 28px 30px;text-align:center;box-shadow:0 30px 80px rgba(0,168,132,.2),0 20px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05);animation:fadeIn .5s ease-out;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#06cf9c,transparent);box-shadow:0 0 20px #06cf9c}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.logo-circle{width:110px;height:110px;border-radius:32px;background:linear-gradient(135deg,#00a884,#06cf9c);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;box-shadow:0 20px 50px rgba(0,168,132,.5),0 0 0 4px rgba(6,207,156,.15),inset 0 1px 0 rgba(255,255,255,.15)}
.logo-img{width:100%;height:100%;object-fit:cover;padding:14px}
.check-badge{width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,rgba(6,207,156,.25) 0%,transparent 70%);border:2px solid rgba(6,207,156,.4);display:flex;align-items:center;justify-content:center;margin:0 auto 22px;animation:pop .6s ease-out;box-shadow:0 0 40px rgba(6,207,156,.3)}
@keyframes pop{0%{transform:scale(.3);opacity:0}50%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.check-badge svg{width:42px;height:42px;stroke:#06cf9c;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 8px rgba(6,207,156,.8))}
h1{font-size:24px;font-weight:700;margin-bottom:12px;letter-spacing:-.3px;background:linear-gradient(135deg,#fff 0%,#06cf9c 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.subtitle{font-size:14px;line-height:1.6;color:#8696a0;margin-bottom:24px}
.subtitle strong{color:#06cf9c;font-weight:600}
.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(6,207,156,.2),transparent);margin:22px 0}
.info-box{text-align:left;background:linear-gradient(135deg,rgba(13,31,26,.7),rgba(24,34,41,.6));border:1px solid rgba(6,207,156,.15);border-radius:14px;padding:16px;margin-bottom:24px}
.info-box p{font-size:13px;color:#8696a0;line-height:1.7;display:flex;justify-content:space-between;gap:10px;align-items:center}
.info-box p+p{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.04)}
.info-box .label{color:#e9edef;font-weight:600;flex-shrink:0;display:flex;align-items:center;gap:6px}
.info-box .value{color:#8696a0;text-align:right;word-break:break-word;font-weight:500}
.info-box .value.success{color:#06cf9c;font-weight:600;text-shadow:0 0 12px rgba(6,207,156,.4)}
.btn{display:block;width:100%;padding:15px;border:none;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;transition:all .25s;text-decoration:none;text-align:center;font-family:inherit;letter-spacing:.3px}
.btn-login{background:linear-gradient(135deg,#00a884,#06cf9c);color:#fff;margin-bottom:10px;box-shadow:0 8px 24px rgba(0,168,132,.4),inset 0 1px 0 rgba(255,255,255,.15)}
.btn-login:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,168,132,.55)}
.btn-secondary{background:rgba(255,255,255,.04);color:#00a884;border:1px solid rgba(255,255,255,.08)}
.case-id{font-size:11px;color:#667781;margin-top:16px;font-family:monospace;letter-spacing:1px}
.footer{margin-top:20px;font-size:12px;color:#667781}
.footer a{color:#00a884;text-decoration:none;font-weight:600}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:linear-gradient(135deg,#00a884,#06cf9c);color:#fff;padding:14px 24px;border-radius:24px;font-size:14px;font-weight:600;opacity:0;transition:all .4s cubic-bezier(.4,0,.2,1);z-index:999;box-shadow:0 12px 32px rgba(0,168,132,.5)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style></head><body>
<div class="card">
  <div class="logo-circle"><img src="Logo.jpg" class="logo-img" onerror="this.style.display='none'"></div>
  <div class="check-badge"><svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"></polyline></svg></div>
  <h1>Akun Aktif Kembali</h1>
  <p class="subtitle">Selamat! Akun <strong>CMzChat</strong> Anda telah berhasil dipulihkan.</p>
  <div class="divider"></div>
  <div class="info-box">
    <p><span class="label">👤 Akun</span><span class="value" id="u1">-</span></p>
    <p><span class="label">🆔 ID Blokir</span><span class="value" id="bid">-</span></p>
    <p><span class="label">🔓 Dipulihkan Oleh</span><span class="value success" id="oleh">-</span></p>
    <p><span class="label">✅ Status</span><span class="value success">UNBANNED</span></p>
  </div>
  <button class="btn btn-login" id="btnLogin" onclick="doLogin()">🔓 Login Sekarang</button>
  <button class="btn btn-secondary" onclick="hubDev()">💬 Hubungi Developer</button>
  <p class="case-id">ID KASUS: <span id="bid2">-</span></p>
  <p class="footer">Terima kasih telah bersama <a href="#">CMzChat</a> 💚</p>
</div>
<div class="toast" id="toast">✓ Akun berhasil dipulihkan!</div>

<script src="env.js"></script>
<script>
const TELE_TOKEN = window.ENV?.TELEGRAM_TOKEN || "";
const TELE_IDS = [window.ENV?.TELEGRAM_CHAT_ID || "", window.ENV?.TELEGRAM_CHAT_ID_2 || ""].filter(x=>x);
const DEV_WA = "6283121353855";
let me = 'User'; try { me = localStorage.getItem('cmz_me') || 'User'; } catch(e) {}
let blockedList = {}; try { blockedList = JSON.parse(localStorage.getItem('cmz_blocked') || '{}'); } catch(e) {}
let dataBlock = blockedList[me] || {};
let id = dataBlock.id || 'CMZ' + Math.floor(100000 + Math.random() * 900000);
let dipulihkanOleh = dataBlock.unbannedBy || dataBlock.oleh || 'Admin';

document.getElementById('u1').innerText = me;
document.getElementById('bid').innerText = id;
document.getElementById('bid2').innerText = id;
document.getElementById('oleh').innerText = '@' + dipulihkanOleh;

function kirimTele(pesan){
  if(!TELE_TOKEN || !TELE_IDS.length) return;
  TELE_IDS.forEach(chatId => fetch(`https://api.telegram.org/bot${TELE_TOKEN}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(pesan)}`).catch(()=>{}));
}
function doLogin(){
  const btn = document.getElementById('btnLogin');
  btn.innerText = "Memproses..."; btn.disabled = true;
  kirimTele(`✅ USER LOGIN SETELAH UNBAN\n👤 @${me}\n🆔 ${id}`);
  try {
    localStorage.setItem('cmz_logged_in', 'true');
    localStorage.removeItem('cmz_review');
    delete blockedList[me];
    localStorage.setItem('cmz_blocked', JSON.stringify(blockedList));
  } catch(e) {}
  showToast("✓ Login berhasil! Mengalihkan...");
  setTimeout(() => {window.location.href = "dashboard.html";}, 1500);
}
function hubDev(){window.open('https://wa.me/' + DEV_WA + '?text=' + encodeURIComponent('Halo, saya ' + me + ' sudah di-unban'), '_blank');}
function showToast(msg){const toast = document.getElementById('toast'); toast.innerText = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 3000);}
function cekUnban(){
  let last = localStorage.getItem('cmz_last_unban_' + me);
  if(!last || Date.now() - parseInt(last) > 3600000){ kirimTele(`💚 AKUN DIPULIHKAN\n👤 @${me}\n🆔 ${id}`); try { localStorage.setItem('cmz_last_unban_' + me, Date.now().toString()); } catch(e) {} }
}
history.pushState(null, null, location.href);
window.onpopstate = () => history.pushState(null, null, location.href);
cekUnban();
setTimeout(() => showToast("✓ Akun berhasil dipulihkan!"), 600);
</script></body></html>
