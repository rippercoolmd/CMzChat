<!DOCTYPE html><html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CMzChat</title>
<link rel="stylesheet" href="assets.css">
<style>
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;overflow:hidden;transition:opacity .5s}
.glow{position:fixed;width:600px;height:600px;border-radius:50%;filter:blur(120px);pointer-events:none;top:50%;left:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(212,175,55,.15) 0%,transparent 70%);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.6}50%{transform:translate(-50%,-50%) scale(1.2);opacity:1}}
.logo{width:130px;height:130px;border-radius:32px;padding:12px;margin-bottom:26px;position:relative;z-index:1;
  background:linear-gradient(135deg,#1e1e23,#0a0a0c);border:1.5px solid rgba(212,175,55,.4);
  box-shadow:0 30px 80px rgba(212,175,55,.35),inset 0 1px 0 rgba(255,255,255,.08);
  display:grid;place-items:center;overflow:hidden;animation:floatIn .8s cubic-bezier(.4,0,.2,1)}
.logo::after{content:'';position:absolute;inset:0;background:linear-gradient(45deg,transparent 40%,rgba(212,175,55,.2) 50%,transparent 60%);animation:shine 3s linear infinite}
@keyframes shine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@keyframes floatIn{from{opacity:0;transform:translateY(30px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
.logo img{width:100%;height:100%;object-fit:contain;position:relative;z-index:1}
h1{font-size:32px;font-weight:800;letter-spacing:-.5px;position:relative;z-index:1;
  background:linear-gradient(135deg,#f5f5f7 0%,#d4af37 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sub{font-size:11px;color:var(--muted);margin-top:8px;letter-spacing:5px;text-transform:uppercase;font-weight:700;position:relative;z-index:1}
.loader{margin-top:36px;width:200px;height:3px;background:rgba(255,255,255,.06);border-radius:10px;overflow:hidden;position:relative;z-index:1}
.bar{height:100%;width:0%;background:var(--grad-gold);border-radius:10px;animation:load 2.4s cubic-bezier(.4,0,.2,1) forwards;box-shadow:0 0 20px rgba(212,175,55,.8)}
@keyframes load{to{width:100%}}
.foot{position:absolute;bottom:40px;text-align:center;z-index:1;animation:fadeUp 1s .4s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.foot h3{font-size:11px;letter-spacing:4px;color:rgba(255,255,255,.35);font-weight:700;text-transform:uppercase}
.foot p{font-size:10px;color:rgba(255,255,255,.2);margin-top:6px;letter-spacing:2px}
.fade{opacity:0}
</style></head><body id="body">
<div class="glow"></div>
<div class="logo"><img src="Logo.jpg" onerror="this.style.display='none';this.parentNode.innerHTML='<span style=\'font-size:44px;font-weight:900;color:#d4af37\'>C</span>'"></div>
<h1>CMzChat</h1>
<p class="sub">Premium Messaging</p>
<div class="loader"><div class="bar"></div></div>
<div class="foot"><h3>TZO Project</h3><p>© 2026 • VVIP Edition</p></div>
<script>
setTimeout(()=>document.getElementById('body').classList.add('fade'),2400);
setTimeout(()=>{
  const me = localStorage.getItem('cmz_me');
  location.href = me ? 'dashboard.html' : 'login.html';
},2900);
</script>
</body></html>
