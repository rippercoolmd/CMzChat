<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CMzChat - Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--g:#00a884;--g2:#06cf9c;--s:#8696A0}
html,body{min-height:100%}
body{background:radial-gradient(circle at 80% 0%,#0f1e22 0%,#0B141A 50%,#070d11 100%);color:#e9edef;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;display:flex;flex-direction:column;min-height:100vh;padding:20px}
.wrap{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:400px;width:100%;margin:0 auto}
.logo-box{text-align:center;margin-bottom:32px;animation:fadeUp .6s ease-out}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.logo-circle{width:88px;height:88px;border-radius:24px;background:linear-gradient(135deg,#fff,#e8f4f0);padding:10px;margin:0 auto 18px;box-shadow:0 20px 50px rgba(0,168,132,.3),0 0 0 1px rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center}
.logo-circle img{width:100%;height:100%;object-fit:contain}
h1{font-size:26px;font-weight:700;letter-spacing:-.5px;margin-bottom:6px}
h1 span{background:linear-gradient(135deg,#fff 0%,var(--g2) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sub{font-size:13px;color:var(--s)}
.card{background:linear-gradient(180deg,rgba(32,44,51,.7) 0%,rgba(32,44,51,.4) 100%);backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.05);animation:fadeUp .6s ease-out .1s both}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;color:var(--s);font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px;padding-left:4px}
.field input{width:100%;background:rgba(11,20,26,.6);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px 16px;color:#e9edef;outline:none;font-size:15px;font-family:inherit;transition:all .25s}
.field input:focus{border-color:var(--g);background:rgba(11,20,26,.9);box-shadow:0 0 0 4px rgba(0,168,132,.12)}
.field input::placeholder{color:#5a6772}
.btn{width:100%;padding:16px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;font-weight:700;font-size:15px;cursor:pointer;transition:all .25s;box-shadow:0 8px 24px rgba(0,168,132,.35),inset 0 1px 0 rgba(255,255,255,.2);margin-top:8px;font-family:inherit}
.btn:active{transform:scale(.98)}
.link-text{text-align:center;margin-top:18px;font-size:13px;color:var(--s)}
.link-text a{color:var(--g2);text-decoration:none;font-weight:600}
.brand-footer{text-align:center;font-size:10px;color:rgba(255,255,255,.25);letter-spacing:3px;text-transform:uppercase;padding-top:20px;font-weight:600}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:14px 24px;border-radius:24px;font-size:14px;font-weight:600;opacity:0;transition:all .35s cubic-bezier(.4,0,.2,1);z-index:999;box-shadow:0 12px 32px rgba(0,168,132,.5);max-width:90%}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.err{background:linear-gradient(135deg,#ff3b3b,#ff5c5c);box-shadow:0 12px 32px rgba(255,59,59,.5)}
</style></head><body>

<div class="wrap">
  <div class="logo-box">
    <div class="logo-circle"><img src="Logo.jpg" alt="CMzChat" onerror="this.parentNode.innerHTML='<span style=\'font-size:32px;font-weight:800;color:#00a884\'>C</span>'"></div>
    <h1>Selamat <span>Datang</span></h1>
    <p class="sub">Masuk ke akun CMzChat kamu</p>
  </div>

  <div class="card">
    <div class="field"><label>Username</label><input id="u" placeholder="username kamu" autocomplete="off"></div>
    <div class="field"><label>Password</label><input id="p" type="password" placeholder="password kamu"></div>
    <button class="btn" onclick="log()">Masuk</button>
    <p class="link-text">Belum punya akun? <a href="daftar.html">Daftar</a></p>
  </div>

  <div class="brand-footer">From TZO Project</div>
</div>

<div class="toast" id="t"></div>

<script src="env.js"></script>
<script>
const K = 'cmzapps_final_wa100_v7';
const TELE_TOKEN = window.ENV?.TELEGRAM_TOKEN || "";
const TELE_IDS = [window.ENV?.TELEGRAM_CHAT_ID || "", window.ENV?.TELEGRAM_CHAT_ID_2 || ""].filter(x => x);

function toast(m, err){let x=document.getElementById('t');x.innerText=m;x.classList.add('show');if(err)x.classList.add('err');else x.classList.remove('err');setTimeout(()=>x.classList.remove('show'),2500)}
function kirimTele(p){
  if(!TELE_TOKEN || !TELE_IDS.length) return;
  TELE_IDS.forEach(id => fetch(`https://api.telegram.org/bot${TELE_TOKEN}/sendMessage?chat_id=${id}&text=${encodeURIComponent(p)}`).catch(()=>{}));
}

function log(){
  let user = document.getElementById('u').value.trim().toLowerCase();
  let pass = document.getElementById('p').value;
  if(!user || !pass) return toast("Isi username & password", true);
  let db = JSON.parse(localStorage.getItem(K) || '{"users":{}}');
  if(!db.users) db.users = {};
  if(!db.users[user]) return toast("Akun tidak ditemukan", true);
  let realPass = db.users[user].pass || db.users[user].password;
  if(realPass !== pass) return toast("Password salah", true);
  localStorage.setItem('cmz_me', user);
  kirimTele(`🔵 LOGIN\n👤 @${user}\n⏰ ${new Date().toLocaleString('id-ID')}`);
  toast("✅ Berhasil masuk");
  setTimeout(() => location.href = 'dashboard.html', 700);
}
document.getElementById('p').addEventListener('keypress', e => {if(e.key==='Enter') log();});
</script></body></html>
