<!DOCTYPE html><html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CMzChat • Fitur</title>
<link rel="stylesheet" href="assets.css">
<style>
body{min-height:100dvh;display:flex;flex-direction:column}
.h{height:64px;padding:0 14px;display:flex;align-items:center;gap:10px;
  background:linear-gradient(180deg,rgba(23,23,27,.96),rgba(17,17,20,.9));
  backdrop-filter:blur(24px);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:5}
.h b{font-size:17px;font-weight:700;
  background:linear-gradient(135deg,#f5f5f7,#d4af37);-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text}
.h .role{margin-left:auto}
.content{flex:1;overflow-y:auto;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
.wrap{padding:16px;max-width:640px;margin:0 auto}
.box{background:var(--grad-card);backdrop-filter:blur(20px);border:1px solid var(--border);
  border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow-md)}
.box.gold{border:1.5px solid rgba(212,175,55,.35);background:linear-gradient(135deg,rgba(42,36,18,.4),rgba(17,17,20,.6))}
.box.blue{border:1.5px solid rgba(29,161,242,.35);background:linear-gradient(135deg,rgba(15,35,55,.4),rgba(17,17,20,.6))}
.box.red{border:1.5px solid rgba(255,77,77,.35);background:linear-gradient(135deg,rgba(55,15,15,.4),rgba(17,17,20,.6))}
.box-title{font-weight:800;margin-bottom:12px;font-size:14px;letter-spacing:.4px;display:flex;align-items:center;gap:8px}
.box-title.gold{color:var(--gold-2)}
.box-title.blue{color:#6cb8ff}
.box-title.red{color:#ff7a7a}
input,select{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--border);
  border-radius:12px;padding:13px 15px;color:var(--text);outline:none;font-size:14px;
  font-family:inherit;margin-top:10px;transition:all .2s}
input:focus,select:focus{border-color:rgba(212,175,55,.5);box-shadow:0 0 0 4px var(--gold-dim)}
select option{background:#1a1a1e;color:#fff}
button{width:100%;padding:13px;border:0;border-radius:12px;font-size:14px;font-weight:700;
  cursor:pointer;font-family:inherit;margin-top:10px;transition:all .2s;letter-spacing:.3px}
.btn-gold{background:var(--grad-gold);color:#0a0a0c;box-shadow:0 8px 20px rgba(212,175,55,.3)}
.btn-ghost{background:var(--glass);color:var(--text);border:1px solid var(--border)}
.btn-red{background:linear-gradient(135deg,#ff4d4d,#c62828);color:#fff;box-shadow:0 8px 20px rgba(255,77,77,.3)}
.btn-blue{background:linear-gradient(135deg,#1DA1F2,#0d8de0);color:#fff;box-shadow:0 8px 20px rgba(29,161,242,.3)}
button:active{transform:scale(.98)}
.msg{font-size:12px;margin-top:10px;color:var(--gold-2);font-weight:600}
.hidden{display:none!important}
.user-row{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.user-row:last-child{border-bottom:0}
.user-row b{font-size:14px;display:flex;align-items:center;gap:6px;color:var(--text)}
.user-meta{font-size:11px;color:var(--muted);margin-top:3px}
.mini-btn{padding:6px 12px!important;font-size:11px!important;width:auto!important;margin:0!important;border-radius:8px!important}
.legend{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5}
</style></head><body>

<div class="h">
  <b>⚙️ Panel Kontrol</b>
  <span class="role" id="myBadge"></span>
</div>

<div class="content">
  <div class="wrap">

    <!-- DEVELOPER PANEL -->
    <div id="boxDevAll" class="hidden">
      <div class="box gold">
        <div class="box-title gold">➕ Tambah / Ubah Role</div>
        <div class="legend" id="rule1"></div>
        <input id="uName" placeholder="Username target" autocomplete="off">
        <select id="uRole"></select>
        <button class="btn-gold" onclick="addRole()">SIMPAN ROLE</button>
        <div class="msg" id="msg1"></div>
      </div>

      <div class="box blue">
        <div class="box-title blue">✔️ Centang Biru (Verified)</div>
        <input id="vName" placeholder="Username target" autocomplete="off">
        <select id="vDur">
          <option value="">-- Pilih durasi --</option>
          <option value="1">1 Hari</option>
          <option value="7">1 Minggu</option>
          <option value="30">1 Bulan</option>
          <option value="365">1 Tahun</option>
          <option value="custom">Custom</option>
        </select>
        <input id="vCustom" type="number" placeholder="Custom hari" style="display:none">
        <button class="btn-blue" onclick="addVerified()">ADD CENTANG BIRU</button>
        <button class="btn-ghost" onclick="removeVerified()">HAPUS CENTANG</button>
        <div class="msg" id="msg2"></div>
      </div>

      <div class="box red">
        <div class="box-title red">🚫 Ban / Unban</div>
        <input id="bName" placeholder="Username target" autocomplete="off">
        <input id="bReason" placeholder="Alasan ban (opsional)" autocomplete="off">
        <button class="btn-red" onclick="banUser()">BAN USER</button>
        <button class="btn-ghost" onclick="unbanUser()">UNBAN USER</button>
        <div class="msg" id="msg3"></div>
      </div>

      <div class="box red">
        <div class="box-title red">🗑️ Hapus Akun Permanen</div>
        <input id="dName" placeholder="Username target" autocomplete="off">
        <button class="btn-red" onclick="deleteUser()">HAPUS PERMANEN</button>
        <div class="msg" id="msg4"></div>
      </div>

      <div class="box">
        <div class="box-title gold" style="color:var(--gold-2)">👥 Daftar Pengguna</div>
        <div id="listRole"><div class="spin" style="width:30px;height:30px"></div></div>
      </div>
    </div>

    <!-- OWNER PANEL -->
    <div id="boxOwnerAll" class="hidden">
      <div class="box gold">
        <div class="box-title gold">👑 Panel Owner</div>
        <div class="legend">Kamu login sebagai Owner. Fitur admin penuh hanya untuk Developer.</div>
      </div>
    </div>

    <!-- USER -->
    <div id="boxUserAll" class="hidden">
      <div class="box">
        <div style="text-align:center;padding:24px">
          <div style="font-size:44px;margin-bottom:12px">🔒</div>
          <b style="font-size:16px" id="userLabel"></b>
          <div class="legend" style="margin-top:8px">User biasa tidak punya akses panel admin</div>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="bottom" style="position:fixed;bottom:0;left:0;right:0;height:calc(76px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:linear-gradient(180deg,#1a1a1e,#15151a);display:flex;border-top:1px solid var(--border);box-shadow:0 -16px 50px rgba(0,0,0,.6);padding-left:6px;padding-right:6px;gap:2px;z-index:10">
  <a href="dashboard.html" class="bnav" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted-2);font-size:9.5px;font-weight:700;text-decoration:none;letter-spacing:.5px;text-transform:uppercase">
    <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    <span>Chat</span>
  </a>
  <a href="status.html" class="bnav" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted-2);font-size:9.5px;font-weight:700;text-decoration:none;letter-spacing:.5px;text-transform:uppercase">
    <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    <span>Status</span>
  </a>
  <a href="informasi.html" class="bnav" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted-2);font-size:9.5px;font-weight:700;text-decoration:none;letter-spacing:.5px;text-transform:uppercase">
    <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="11"/><circle cx="12" cy="8" r="1" fill="currentColor"/></svg>
    <span>Info</span>
  </a>
  <a href="fitur.html" class="bnav" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--gold-2);font-size:9.5px;font-weight:700;text-decoration:none;letter-spacing:.5px;text-transform:uppercase;background:linear-gradient(180deg,rgba(212,175,55,.12),transparent);border-radius:16px;margin:6px 3px 4px;position:relative">
    <div style="position:absolute;top:0;left:50%;transform:translateX(-50%);width:36px;height:3px;background:var(--grad-gold);border-radius:0 0 6px 6px;box-shadow:0 0 16px var(--gold)"></div>
    <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;filter:drop-shadow(0 0 8px rgba(212,175,55,.6))"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span>Fitur</span>
  </a>
</div>

<div class="toast" id="toast"></div>

<script src="env.js"></script>
<script src="config.js"></script>
<script>
const me = SESSION.me;
if(!me) location.href = 'login.html';

let db = { users: {} };

function toast(m, err){const t=document.getElementById('toast');t.textContent=m;t.className='toast show '+(err?'err':'gold');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),2500);}
function isVer(u){try{return db.users[u]?.verified && db.users[u].verified.end > Date.now();}catch(e){return false;}}
function badgeSVG(){return '<svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:#d4af37"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>';}

function myInfo(){
  if(me === 'ceomudaz') return { role:'Developer', isRoot:true };
  if(me === 'Fajars') return { role:'Developer', isCoDev:true };
  return { role: db.users[me]?.role || 'User' };
}

async function setup(){
  const udb = await readDB("database.json", { users: {} });
  db = udb;
  const info = myInfo();

  if(info.isRoot || info.role === 'Developer'){
    document.getElementById('boxDevAll').classList.remove('hidden');
    document.getElementById('myBadge').innerHTML = '<span class="chip chip-dev">DEVELOPER</span>';
    document.getElementById('rule1').textContent = info.isRoot
      ? '✓ Root: bisa add Developer & Owner'
      : '✓ Co-Dev: bisa add Owner';
    document.getElementById('uRole').innerHTML = info.isRoot
      ? '<option value="">-- Pilih role --</option><option value="Developer">Developer</option><option value="Owner">Owner</option><option value="__remove__">User Biasa</option>'
      : '<option value="">-- Pilih role --</option><option value="Owner">Owner</option><option value="__remove__">User Biasa</option>';
    renderUsers();
  } else if(info.role === 'Owner'){
    document.getElementById('boxOwnerAll').classList.remove('hidden');
    document.getElementById('myBadge').innerHTML = '<span class="chip chip-gold">OWNER</span>';
  } else {
    document.getElementById('boxUserAll').classList.remove('hidden');
    document.getElementById('myBadge').innerHTML = '<span class="chip chip-silver">USER</span>';
    document.getElementById('userLabel').textContent = '@' + me;
  }
}

document.getElementById('vDur').addEventListener('change', function(){
  document.getElementById('vCustom').style.display = this.value === 'custom' ? 'block' : 'none';
});

function renderUsers(){
  const el = document.getElementById('listRole');
  const users = Object.keys(db.users).sort();
  if(!users.length){ el.innerHTML = '<div class="legend">Belum ada user</div>'; return; }
  el.innerHTML = users.map(u => {
    const role = db.users[u].role || 'User';
    const ver = isVer(u) ? badgeSVG() : '';
    const ban = db.users[u].banned ? ' 🚫' : '';
    const canDelete = u !== me && u !== 'ceomudaz';
    return `<div class="user-row">
      <div>
        <b>${u}${ver}${ban}</b>
        <div class="user-meta">${role}${db.users[u].banned?' • banned by @'+db.users[u].banned.by:''}</div>
      </div>
      ${canDelete ? `<button class="btn-red mini-btn" onclick="quickDelete('${u}')">Hapus</button>` : ''}
    </div>`;
  }).join('');
}

async function addRole(){
  const n = document.getElementById('uName').value.trim().toLowerCase();
  const rv = document.getElementById('uRole').value;
  const info = myInfo();
  const msg = document.getElementById('msg1');

  if(!n || !rv){ msg.textContent = '❌ Isi username & role'; return; }
  if(n === 'ceomudaz'){ msg.textContent = '❌ Tidak bisa ubah root'; return; }
  if(!info.isRoot && rv === 'Developer'){ msg.textContent = '❌ Hanya Root bisa add Developer'; return; }
  if(!db.users[n]){ msg.textContent = '❌ User tidak ditemukan'; return; }

  if(rv === '__remove__'){
    delete db.users[n].role;
    msg.textContent = `✅ @${n} → User Biasa`;
    cloneToTelegram("👤", "ROLE DIHAPUS", [`🎯 Target: @${n}`,`👑 Jadi: User Biasa`,`🔒 Oleh: @${me}`]);
  } else {
    db.users[n].role = rv;
    db.users[n].createdBy = me;
    msg.textContent = `✅ @${n} → ${rv}`;
    cloneToTelegram("👑", "ADD ROLE", [`🎯 Target: @${n}`,`✨ Role: <b>${rv}</b>`,`🔒 Oleh: @${me}`]);
  }
  await writeDB("database.json", db);
  renderUsers();
}

async function addVerified(){
  const n = document.getElementById('vName').value.trim().toLowerCase();
  const sel = document.getElementById('vDur').value;
  const d = sel === 'custom' ? parseInt(document.getElementById('vCustom').value) : parseInt(sel);
  const msg = document.getElementById('msg2');
  if(!n || !d){ msg.textContent = '❌ Isi username & durasi'; return; }
  if(!db.users[n]){ msg.textContent = '❌ User tidak ditemukan'; return; }
  db.users[n].verified = { end: Date.now() + d*86400000, by: me, start: Date.now() };
  await writeDB("database.json", db);
  msg.textContent = `✅ @${n} verified selama ${d} hari`;
  cloneToTelegram("✔️", "CENTANG BIRU", [`🎯 Target: @${n}`,`📅 Durasi: <b>${d} hari</b>`,`🔒 Oleh: @${me}`]);
  renderUsers();
}

async function removeVerified(){
  const n = document.getElementById('vName').value.trim().toLowerCase();
  const msg = document.getElementById('msg2');
  if(!n || !db.users[n]?.verified){ msg.textContent = '❌ User tidak ada centang'; return; }
  delete db.users[n].verified;
  await writeDB("database.json", db);
  msg.textContent = `✅ Hapus centang @${n}`;
  cloneToTelegram("❌", "HAPUS CENTANG", [`🎯 Target: @${n}`,`🔒 Oleh: @${me}`]);
  renderUsers();
}

async function banUser(){
  const n = document.getElementById('bName').value.trim().toLowerCase();
  const reason = document.getElementById('bReason').value.trim() || 'Melanggar Ketentuan Layanan';
  const msg = document.getElementById('msg3');
  if(!n || !db.users[n]){ msg.textContent = '❌ Username tidak valid'; return; }
  if(n === 'ceomudaz'){ msg.textContent = '❌ Tidak bisa ban root'; return; }
  if(n === me){ msg.textContent = '❌ Tidak bisa ban diri sendiri'; return; }

  const idBlokir = 'CMZ' + Math.floor(100000 + Math.random()*900000);
  db.users[n].banned = { by: me, time: Date.now(), reason, id: idBlokir };
  await writeDB("database.json", db);

  const blocked = await readDB("blocked.json", { blocked: {} });
  blocked.blocked[n] = { by: me, time: Date.now(), reason, id: idBlokir };
  await writeDB("blocked.json", blocked);

  msg.textContent = `✅ @${n} dibanned`;
  cloneToTelegram("⛔", "USER DIBANNED", [
    `👤 Korban: <b>@${n}</b>`,
    `🆔 ID: <code>${idBlokir}</code>`,
    `🔒 Oleh: @${me}`,
    `📝 ${reason}`
  ]);
  renderUsers();
}

async function unbanUser(){
  const n = document.getElementById('bName').value.trim().toLowerCase();
  const msg = document.getElementById('msg3');
  if(!n || !db.users[n]){ msg.textContent = '❌ User tidak ditemukan'; return; }

  delete db.users[n].banned;
  await writeDB("database.json", db);

  const blocked = await readDB("blocked.json", { blocked: {} });
  if(blocked.blocked[n]){
    blocked.blocked[n].unbannedBy = me;
    delete blocked.blocked[n];
  }
  await writeDB("blocked.json", blocked);

  const review = await readDB("review.json", { review: {} });
  delete review.review[n];
  await writeDB("review.json", review);

  msg.textContent = `✅ @${n} di-unban`;
  cloneToTelegram("✅", "USER DI-UNBAN", [`👤 @${n}`,`🔓 Oleh: @${me}`]);
  renderUsers();
}

async function quickDelete(u){ document.getElementById('dName').value = u; deleteUser(); }

async function deleteUser(){
  const n = document.getElementById('dName').value.trim().toLowerCase();
  const msg = document.getElementById('msg4');
  if(!db.users[n]){ msg.textContent = '❌ User tidak ditemukan'; return; }
  if(n === 'ceomudaz' || n === me){ msg.textContent = '❌ Tidak bisa hapus user ini'; return; }
  if(!confirm(`Hapus @${n} PERMANEN?`)) return;

  delete db.users[n];
  await writeDB("database.json", db);

  const blocked = await readDB("blocked.json", { blocked: {} });
  delete blocked.blocked[n];
  await writeDB("blocked.json", blocked);

  msg.textContent = `✅ @${n} dihapus`;
  cloneToTelegram("🗑️", "AKUN DIHAPUS", [`👤 @${n}`,`💀 Oleh: @${me}`]);
  renderUsers();
}

setup();
</script></body></html>
