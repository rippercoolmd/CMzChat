<!DOCTYPE html><html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CMzChat • Grup</title>
<link rel="stylesheet" href="assets.css">
<style>
body{min-height:100dvh}
.h{height:64px;padding:0 12px;display:flex;align-items:center;gap:10px;
  background:linear-gradient(180deg,rgba(23,23,27,.96),rgba(17,17,20,.9));
  backdrop-filter:blur(24px);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:5;position:relative}
.h::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(212,175,55,.4),transparent)}
.back{width:42px;height:42px;border:0;background:transparent;color:var(--silver);font-size:20px;
  border-radius:50%;cursor:pointer;display:grid;place-items:center}
.back:active{background:var(--glass-2)}
.h b{font-size:17px;font-weight:700;flex:1;
  background:linear-gradient(135deg,#f5f5f7,#d4af37);-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text}
.add{width:42px;height:42px;border:0;border-radius:50%;font-size:22px;cursor:pointer;
  background:var(--grad-gold);color:#0a0a0c;display:grid;place-items:center;
  box-shadow:0 6px 20px rgba(212,175,55,.4)}
.wrap{padding:16px;max-width:640px;margin:0 auto}
.section-label{font-size:11px;font-weight:800;color:var(--gold-2);
  letter-spacing:1.2px;text-transform:uppercase;padding:8px 4px;display:flex;align-items:center;gap:8px}
.section-label::before{content:'';width:3px;height:12px;background:var(--grad-gold);border-radius:2px}
.grp{background:var(--grad-card);backdrop-filter:blur(20px);border:1px solid var(--border);
  border-radius:16px;padding:14px;margin-bottom:10px;display:flex;gap:14px;align-items:center;
  cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.grp:active{transform:scale(.99)}
.grp.global{
  border:1.5px solid rgba(212,175,55,.45);
  background:linear-gradient(135deg,rgba(212,175,55,.12),rgba(20,20,24,.7));
  box-shadow:0 12px 32px rgba(212,175,55,.2)
}
.grp.global::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--grad-gold);box-shadow:0 0 20px rgba(212,175,55,.6)}
.grp-av{width:52px;height:52px;border-radius:50%;background:var(--grad-gold);color:#0a0a0c;
  display:grid;place-items:center;font-size:24px;flex-shrink:0;
  box-shadow:0 4px 14px rgba(212,175,55,.3)}
.grp-info{flex:1;min-width:0}
.grp-name{font-size:15px;font-weight:700;color:var(--text);margin-bottom:3px;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.grp-sub{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:3px}
.empty{text-align:center;padding:60px 24px;color:var(--muted)}
.empty .em{font-size:52px;opacity:.2;margin-bottom:14px}
.empty b{display:block;font-size:15px;color:var(--text);margin-bottom:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);
  z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.modal-box{background:var(--grad-card);backdrop-filter:blur(24px);border:1px solid var(--border-2);
  border-radius:20px;padding:22px;max-width:440px;width:100%;max-height:85vh;overflow-y:auto;
  box-shadow:var(--shadow-lg)}
.modal-box h3{font-size:16px;font-weight:700;margin-bottom:14px;
  background:linear-gradient(135deg,#f5f5f7,#d4af37);-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text}
input{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:12px;
  padding:13px 15px;color:var(--text);outline:none;font-size:14px;font-family:inherit;
  margin-bottom:10px;transition:all .2s}
input:focus{border-color:rgba(212,175,55,.5);box-shadow:0 0 0 4px var(--gold-dim)}
.member-row{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;
  cursor:pointer;transition:background .15s}
.member-row:active,.member-row.selected{background:var(--gold-dim)}
.av-sm{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#2a2a30,#1a1a1e);
  display:grid;place-items:center;font-size:15px;font-weight:700;color:var(--gold-2);
  overflow:hidden;border:1px solid var(--border);flex-shrink:0}
.av-sm img{width:100%;height:100%;object-fit:cover}
.chk{width:24px;height:24px;border:2px solid var(--muted);border-radius:50%;
  display:grid;place-items:center;font-size:13px;color:transparent;transition:all .2s}
.member-row.selected .chk{background:var(--grad-gold);border-color:var(--gold);color:#0a0a0c}
.lock-badge{font-size:9px;padding:2px 8px;border-radius:8px;background:rgba(212,175,55,.15);
  color:var(--gold-2);font-weight:800;letter-spacing:.4px;text-transform:uppercase;
  border:1px solid rgba(212,175,55,.3)}
</style></head><body>
<div class="h">
  <button class="back" onclick="location.href='dashboard.html'">←</button>
  <b>👥 Grup</b>
  <button class="add" onclick="openCreate()">+</button>
</div>
<div class="wrap">
  <div class="section-label">🌐 Grup Global (Wajib)</div>
  <div id="globalSlot"><div class="spin" style="width:30px;height:30px;margin:20px auto"></div></div>

  <div class="section-label" style="margin-top:16px">👥 Grup Saya</div>
  <div id="listGrup"></div>
</div>

<div class="modal" id="createModal" onclick="if(event.target===this)closeCreate()">
  <div class="modal-box">
    <h3>👥 Buat Grup Baru</h3>
    <input id="grpName" placeholder="Nama grup...">
    <div style="font-size:12px;color:var(--muted);margin:8px 0">Pilih anggota:</div>
    <div id="memberList"></div>
    <button class="btn btn-gold" onclick="createGroup()" style="margin-top:14px">✅ BUAT GRUP</button>
    <button class="btn btn-ghost" onclick="closeCreate()" style="margin-top:8px">Batal</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="env.js"></script>
<script src="config.js"></script>
<script>
const me = SESSION.me;
if(!me) location.href = 'login.html';

let db = { users: {} };
let groups = [];
let selectedMembers = [];

function toast(m, err){
  const t = document.getElementById('toast');
  t.textContent = m;
  t.className = 'toast show ' + (err ? 'err' : 'gold');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove('show'), 2200);
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

async function init(){
  // Load user
  db = await readDB("database.json", { users: {} });

  // Sync avatars
  const av = await readDB("avatars.json", { avatars: {} });
  localStorage.setItem('cmz_avatars_v1', JSON.stringify(av.avatars || {}));

  // Pastikan Global Group ada
  await ensureGlobalGroup();

  // Baca groups
  let g = await readDB("groups.json", { groups: [] });
  if(!g.groups) g.groups = [];

  // Cari GLOBAL — kalau tidak ada, buat
  let gg = g.groups.find(x => x.id === GLOBAL_ID);
  if(!gg){
    console.warn("[CMzChat] Buat Global Group...");
    gg = {
      id: GLOBAL_ID,
      name: "Global CMzChat",
      isGlobal: true,
      createdBy: "system",
      createdAt: 0,
      members: []
    };
    g.groups.unshift(gg);
  }

  // Sync members = semua user terdaftar
  const allUsers = Object.keys(db.users || {});
  const needSync = gg.members.length !== allUsers.length ||
                   !allUsers.every(u => gg.members.includes(u));

  if(needSync){
    gg.members = allUsers;
    await writeDB("groups.json", g);
    // Re-read biar sinkron
    const g2 = await readDB("groups.json", { groups: [] });
    groups = g2.groups || [];
  } else {
    groups = g.groups;
  }

  renderGlobal();
  renderGroups();
}

function renderGlobal(){
  const el = document.getElementById('globalSlot');
  if(!db.users?.[me]){
    el.innerHTML = '<div style="text-align:center;color:var(--muted);font-size:12px;padding:20px">Akun tidak valid</div>';
    return;
  }
  const admins = Object.keys(db.users).filter(u => db.users[u].role === 'Developer');
  const adminNames = admins.map(a => '@' + a).join(', ');
  el.innerHTML =
    '<div class="grp global" onclick="openGroup(\'' + GLOBAL_ID + '\')">' +
      '<div class="grp-av">🌐</div>' +
      '<div class="grp-info">' +
        '<div class="grp-name">' +
          'Global CMzChat' +
          ' <span class="lock-badge">🔒 WAJIB</span>' +
        '</div>' +
        '<div class="grp-sub">' +
          '👑 Admin: ' + (esc(adminNames) || 'system') +
        '</div>' +
        '<div class="grp-sub">' +
          Object.keys(db.users).length + ' anggota • semua user otomatis masuk' +
        '</div>' +
      '</div>' +
    '</div>';
}

function renderGroups(){
  const el = document.getElementById('listGrup');
  const myGroups = groups.filter(g => !g.isGlobal && isMemberOf(g, me, db));
  if(!myGroups.length){
    el.innerHTML = '<div class="empty"><div class="em">👥</div><b>Belum ada grup lain</b>Tekan tombol + untuk buat grup</div>';
    return;
  }
  el.innerHTML = myGroups.map(g => {
    const admin = g.createdBy || 'system';
    return '<div class="grp" onclick="openGroup(\'' + g.id + '\')">' +
      '<div class="grp-av">👥</div>' +
      '<div class="grp-info">' +
        '<div class="grp-name">' + esc(g.name) + '</div>' +
        '<div class="grp-sub">👑 @' + esc(admin) + ' • ' + g.members.length + ' anggota</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

function openGroup(id){
  location.href = 'grup-chat.html?id=' + encodeURIComponent(id);
}

function openCreate(){
  selectedMembers = [];
  document.getElementById('grpName').value = '';
  const users = Object.keys(db.users).filter(u => u !== me && !db.users[u].banned);
  const el = document.getElementById('memberList');
  if(!users.length){
    el.innerHTML = '<div style="text-align:center;color:var(--muted);padding:20px;font-size:13px">Belum ada user lain</div>';
  } else {
    el.innerHTML = users.map(u => {
      const av = SESSION.avatar[u];
      const inner = av ? '<img src="' + av + '">' : u[0].toUpperCase();
      return '<div class="member-row" data-user="' + u + '" onclick="toggleMember(\'' + u + '\')">' +
        '<div class="av-sm">' + inner + '</div>' +
        '<div style="flex:1;font-weight:600">' + esc(u) + '</div>' +
        '<div class="chk">✓</div>' +
      '</div>';
    }).join('');
  }
  document.getElementById('createModal').classList.add('show');
}

function closeCreate(){ document.getElementById('createModal').classList.remove('show'); }

function toggleMember(u){
  const i = selectedMembers.indexOf(u);
  if(i >= 0) selectedMembers.splice(i, 1); else selectedMembers.push(u);
  document.querySelectorAll('.member-row').forEach(el => {
    el.classList.toggle('selected', selectedMembers.includes(el.dataset.user));
  });
}

async function createGroup(){
  const name = document.getElementById('grpName').value.trim();
  if(!name) return toast('❌ Isi nama grup', true);
  if(!selectedMembers.length) return toast('❌ Pilih minimal 1 anggota', true);

  const newG = {
    id: 'G' + Date.now() + Math.random().toString(36).slice(2,6),
    name: name,
    members: [me].concat(selectedMembers),
    admins: [me],
    createdBy: me,
    createdAt: Date.now()
  };

  const g = await readDB("groups.json", { groups: [] });
  if(!g.groups) g.groups = [];
  g.groups.push(newG);
  await writeDB("groups.json", g);

  cloneToTelegram("👥", "GRUP BARU DIBUAT", [
    "📛 Nama: <b>" + esc(name) + "</b>",
    "👤 Creator: @" + me,
    "👥 Anggota: " + newG.members.map(u=>'@'+u).join(', '),
    "🔑 <code>" + newG.id + "</code>"
  ]);

  closeCreate();
  toast('✅ Grup dibuat!');
  setTimeout(()=>openGroup(newG.id), 600);
}

init();
window.addEventListener('focus', init);
</script></body></html>
