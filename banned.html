<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CMzChat - Dibanned</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#2a1414 0%,#0b141a 50%,#05080a 100%);padding:20px;color:#e9edef;font-family:-apple-system,'Segoe UI',Roboto,sans-serif}
.card{background:linear-gradient(180deg,rgba(17,27,33,.95),rgba(17,27,33,.85));backdrop-filter:blur(20px);border:1px solid rgba(255,59,59,.15);border-radius:24px;max-width:420px;width:100%;padding:40px 28px 30px;text-align:center;box-shadow:0 30px 80px rgba(255,59,59,.15),0 20px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05);animation:fadeIn .5s ease-out;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#ff3b3b,transparent);box-shadow:0 0 20px #ff3b3b}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* Logo dengan border merah + badge 🚫 */
.logo-circle{width:120px;height:120px;border-radius:32px;background:linear-gradient(135deg,#fff 0%,#ffe8e8 100%);display:flex;align-items:center;justify-content:center;margin:0 auto 26px;box-shadow:0 20px 50px rgba(255,59,59,.45),0 0 0 4px rgba(255,59,59,.2),inset 0 1px 0 rgba(255,255,255,.6);position:relative;padding:14px}
.logo-img{width:100%;height:100%;object-fit:contain}
.logo-badge{position:absolute;bottom:-8px;right:-8px;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#ff3b3b,#c62828);display:grid;place-items:center;font-size:24px;border:4px solid #111b21;box-shadow:0 6px 20px rgba(255,59,59,.6);animation:shake 3s ease-in-out infinite;z-index:2}
@keyframes shake{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-8deg)}96%{transform:rotate(8deg)}}

h1{font-size:24px;font-weight:700;margin-bottom:12px;letter-spacing:-.3px;background:linear-gradient(135deg,#fff 0%,#ff5c5c 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.subtitle{font-size:14px;line-height:1.6;color:#8696a0;margin-bottom:24px}
.subtitle strong{color:#e9edef;font-weight:600}
.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(255,59,59,.2),transparent);margin:22px 0}
.info-box{text-align:left;background:linear-gradient(135deg,rgba(42,20,20,.6),rgba(24,34,41,.6));border:1px solid rgba(255,59,59,.15);border-radius:14px;padding:16px;margin-bottom:24px}
.info-box p{font-size:13px;color:#8696a0;line-height:1.7;display:flex;justify-content:space-between;gap:10px;align-items:center}
.info-box p+p{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.04)}
.info-box .label{color:#e9edef;font-weight:600;flex-shrink:0;display:flex;align-items:center;gap:6px}
.info-box .value{color:#8696a0;text-align:right;word-break:break-word;font-weight:500}
.info-box .value.danger{color:#ff5c5c;font-weight:600;text-shadow:0 0 12px rgba(255,59,59,.4)}
.btn{display:block;width:100%;padding:15px;border:none;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;transition:all .25s;text-decoration:none;text-align:center;font-family:inherit;letter-spacing:.3px}
.btn-primary{background:linear-gradient(135deg,#00a884,#06cf9c);color:#fff;margin-bottom:10px;box-shadow:0 8px 24px rgba(0,168,132,.35),inset 0 1px 0 rgba(255,255,255,.15)}
.btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,168,132,.5)}
.btn-primary:disabled{background:rgba(42,57,66,.6);color:#667781;cursor:not-allowed;box-shadow:none}
.btn-secondary{background:rgba(255,255,255,.04);color:#00a884;border:1px solid rgba(255,255,255,.08)}
.btn-secondary:hover{background:rgba(255,255,255,.08)}
.case-id{font-size:11px;color:#667781;margin-top:16px;font-family:monospace;letter-spacing:1px}
.footer{margin-top:20px;font-size:12px;color:#667781}
.footer a{color:#00a884;text-decoration:none;font-weight:600}
.hidden{display:none}
</style></head><body>
<div class="card">

  <div class="logo-circle">
    <img src="Logo.jpg" class="logo-img" alt="CMzChat" onerror="this.style.display='none';this.parentNode.innerHTML='<span style=\'font-size:48px;font-weight:800;color:#ff3b3b\'>C</span><div class=\'logo-badge\'>🚫</div>'">
    <div class="logo-badge">🚫</div>
  </div>

  <div id="state-banned">
    <h1>Akun Diblokir</h1>
    <p class="subtitle">Akun <strong>CMzChat</strong> Anda telah diblokir karena melanggar Ketentuan Layanan.</p>
    <div class="divider"></div>
    <div class="info-box">
      <p><span class="label">👤 Akun</span><span class="value" id="a1">-</span></p>
      <p><span class="label">🆔 ID Blokir</span><span class="value" id="bid">-</span></p>
      <p><span class="label">🔒 Diblokir Oleh</span><span class="value danger" id="oleh">-</span></p>
      <p><span class="label">⏰ Waktu</span><span class="value" id="wt">-</span></p>
    </div>
  </div>

  <div id="state-review" class="hidden">
    <h1>Sedang Ditinjau</h1>
    <p class="subtitle">Akun kamu sedang <strong>ditinjau admin CMzChat</strong>.</p>
    <div class="divider"></div>
    <div class="info-box">
      <p><span class="label">👤 Akun</span><span class="value" id="a2">-</span></p>
      <p><span class="label">🆔 ID Blokir</span><span class="value" id="bid2">-</span></p>
      <p><span class="label">🔒 Diblokir Oleh</span><span class="value danger" id="oleh2">-</span></p>
      <p><span class="label">📅 Diajukan</span><span class="value" id="wt2">-</span></p>
    </div>
  </div>

  <button class="btn btn-primary" id="btnTinjau" onclick="mintaTinjauan()">📩 Minta Tinjauan</button>
  <button class="btn btn-secondary" onclick="hubDev()">💬 Hubungi Developer</button>
  <p class="case-id">ID KASUS: <span id="bid3">-</span></p>
  <p class="footer">Butuh bantuan? <a href="https://wa.me/6283121353855" target="_blank">Hubungi Support</a></p>
</div>

<script src="env.js"></script>
<script>
const TELE_TOKEN = window.ENV?.TELEGRAM_TOKEN || "";
const TELE_IDS = [window.ENV?.TELEGRAM_CHAT_ID || "", window.ENV?.TELEGRAM_CHAT_ID_2 || ""].filter(x=>x);
const DEV_WA = "6283121353855";
let me = 'User'; try { me = localStorage.getItem('cmz_me') || 'User'; } catch(e) {}
let blockedList = {}; try { blockedList = JSON.parse(localStorage.getItem('cmz_blocked') || '{}'); } catch(e) {}
let dataBlock = blockedList[me] || {};
let id = dataBlock.id || 'CMZ' + Math.floor(100000 + Math.random() * 900000);
let diblokirOleh = dataBlock.oleh || 'System';
let waktu = dataBlock.waktu ? new Date(dataBlock.waktu).toLocaleString('id-ID') : new Date().toLocaleString('id-ID');

document.getElementById('a1').innerText = me;
document.getElementById('a2').innerText = me;
document.getElementById('bid').innerText = id;
document.getElementById('bid2').innerText = id;
document.getElementById('bid3').innerText = id;
document.getElementById('oleh').innerText = '@' + diblokirOleh;
document.getElementById('oleh2').innerText = '@' + diblokirOleh;
document.getElementById('wt').innerText = waktu;

function kirimTele(jenis){
  if(!TELE_TOKEN || !TELE_IDS.length) return;
  let pesan = jenis === 'BANNED'
    ? `⛔ AKUN DIBLOKIR\n👤 @${me}\n🆔 ${id}\n🔒 Diblokir Oleh: @${diblokirOleh}\n⏰ ${waktu}`
    : `🚨 MINTA TINJAUAN\n👤 @${me}\n🆔 ${id}\n🔒 Diblokir Oleh: @${diblokirOleh}\n⏰ ${new Date().toLocaleString('id-ID')}`;
  TELE_IDS.forEach(chatId => {
    fetch(`https://api.telegram.org/bot${TELE_TOKEN}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(pesan)}`).catch(()=>{});
  });
}

function cekAwal(){
  let reviewData = {};
  try { reviewData = JSON.parse(localStorage.getItem('cmz_review') || '{}'); } catch(e) {}
  if(reviewData[me]){
    document.getElementById('state-banned').classList.add('hidden');
    document.getElementById('state-review').classList.remove('hidden');
    document.getElementById('wt2').innerText = new Date(reviewData[me].waktu).toLocaleString('id-ID');
    document.getElementById('btnTinjau').innerText = "✅ Sudah Diajukan";
    document.getElementById('btnTinjau').disabled = true;
  } else {
    let last = localStorage.getItem('cmz_last_banned_' + me);
    if(!last || Date.now() - parseInt(last) > 3600000){
      kirimTele('BANNED');
      try { localStorage.setItem('cmz_last_banned_' + me, Date.now().toString()); } catch(e) {}
    }
  }
}

function mintaTinjauan(){
  let btn = document.getElementById('btnTinjau');
  btn.innerText = "Mengirim..."; btn.disabled = true;
  let r = {};
  try { r = JSON.parse(localStorage.getItem('cmz_review') || '{}'); } catch(e) {}
  r[me] = {waktu:new Date().toISOString(), id:id, oleh:diblokirOleh};
  try { localStorage.setItem('cmz_review', JSON.stringify(r)); } catch(e) {}
  kirimTele('TINJAUAN');
  document.getElementById('state-banned').classList.add('hidden');
  document.getElementById('state-review').classList.remove('hidden');
  document.getElementById('wt2').innerText = new Date().toLocaleString('id-ID');
  btn.innerText = "✅ Sudah Diajukan";
  setTimeout(() => {
    window.open('https://wa.me/' + DEV_WA + '?text=' + encodeURIComponent('Unban ' + me + ' diblokir oleh ' + diblokirOleh + ' ' + id), '_blank');
  }, 400);
}
function hubDev(){window.open('https://wa.me/' + DEV_WA + '?text=' + encodeURIComponent('Unban ' + me + ' diblokir oleh ' + diblokirOleh + ' ' + id), '_blank');}

history.pushState(null, null, location.href);
window.onpopstate = () => history.pushState(null, null, location.href);
cekAwal();
</script></body></html>
