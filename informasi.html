<!DOCTYPE html><html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CMzChat • Info</title>
<link rel="stylesheet" href="assets.css">
<style>
body{min-height:100dvh;display:flex;flex-direction:column}
.h{height:64px;padding:0 14px;display:flex;align-items:center;
  background:linear-gradient(180deg,rgba(23,23,27,.96),rgba(17,17,20,.9));
  backdrop-filter:blur(24px);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:5;position:relative}
.h::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(212,175,55,.4),transparent)}
.h b{font-size:17px;font-weight:700;
  background:linear-gradient(135deg,#f5f5f7,#d4af37);-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text}
.h .role{margin-left:auto}
.content{flex:1;overflow-y:auto;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
.wrap{padding:16px;max-width:640px;margin:0 auto}
.box{background:var(--grad-card);backdrop-filter:blur(20px);border:1px solid var(--border);
  border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow-md)}
.box.gold{border-color:rgba(212,175,55,.3)}
input,textarea{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--border);
  border-radius:12px;padding:13px 15px;color:var(--text);outline:none;font-size:14px;
  font-family:inherit;margin-top:10px;transition:all .2s;resize:vertical}
input:focus,textarea:focus{border-color:rgba(212,175,55,.5);box-shadow:0 0 0 4px var(--gold-dim)}
.iklan{border-left:3px solid var(--gold);background:linear-gradient(135deg,rgba(30,30,35,.7),rgba(20,20,24,.7));
  border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--border);border-left-width:3px}
.iklan.dev{border-left-color:#ff4d4d}
.iklan.own{border-left-color:var(--gold)}
.upload{border:1.5px dashed var(--border-2);border-radius:12px;padding:16px;text-align:center;
  margin-top:10px;cursor:pointer;color:var(--muted);font-size:12px;transition:all .2s}
.upload:hover{border-color:rgba(212,175,55,.4);background:rgba(212,175,55,.03)}
.upload img{max-width:100%;max-height:200px;border-radius:10px;margin-top:10px;display:none}
.hidden{display:none!important}
.legend{font-size:12px;color:var(--muted)}
.iklan-meta{font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:5px}
.iklan-body{margin-top:8px;font-size:13.5px;white-space:pre-wrap;line-height:1.55;color:var(--text)}
.iklan-link{color:var(--gold-2);font-size:12px;text-decoration:none;display:inline-block;margin-top:8px;font-weight:600}
.del-btn{padding:5px 12px;font-size:10.5px;font-weight:700;border-radius:8px;cursor:pointer;
  background:rgba(255,77,77,.1);color:#ff7a7a;border:1px solid rgba(255,77,77,.3);font-family:inherit}
</style></head><body>

<div class="h">
  <b>📢 Info & Iklan</b>
  <span class="role" id="myBadge"></span>
</div>

<div class="content">
  <div class="wrap">
    <div id="boxPost" class="hidden">
      <div class="box gold">
        <div style="font-weight:800;color:var(--gold-2);margin-bottom:10px">➕ Pasang Iklan</div>
        <input id="ikJudul" placeholder="Judul iklan">
        <textarea id="ikIsi" rows="3" placeholder="Isi iklan..."></textarea>
        <input id="ikLink" placeholder="Link (opsional)">
        <div class="upload" onclick="document.getElementById('ikFoto').click()">
          <span id="upText">📷 Tambah Foto (opsional)</span>
          <img id="previewPost">
          <input type="file" id="ikFoto" accept="image/*" style="display:none">
        </div>
        <button class="btn btn-gold" onclick="postIklan()" style="margin-top:12px">POSTING IKLAN</button>
      </div>
    </div>

    <div class="box">
      <div style="font-weight:800;color:var(--gold-2);margin-bottom:12px">📢 Daftar Iklan</div>
      <div id="listIklan"><div class="spin" style="width:30px;height:30px;margin:20px auto"></div></div>
    </div>
  </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom" style="position:fixed;bottom:0;left:0;right:0;height:calc(76px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:linear-gradient(180deg,#1a1a1e,#15151a);display:flex;border-top:1px solid var(--border);box-shadow:0 -16px 50px rgba(0,0,0,.6);padding-left:6px;padding-right:6px;gap:2px;z-index:10">
  <a href="dashboard.html" class="bnav" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted-2);font-size:9.5px;font-weight:700;text-decoration:none;letter-spacing:.5px;text-transform:uppercase">
    <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    <span>Chat</span>
  </a>
  <a href="status.html" class="bnav" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted-2);font-size:9.5px;font-weight:700;text-decoration:none;letter-spacing:.5px;text-transform:uppercase">
    <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    <span>Status</span>
  </a>
  <a href="informasi.html" class="bnav" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--gold-2);font-size:9.5px;font-weight:700;text-decoration:none;letter-spacing:.5px;text-transform:uppercase;background:linear-gradient(180deg,rgba(212,175,55,.12),transparent);border-radius:16px;margin:6px 3px 4px;position:relative">
    <div style="position:absolute;top:0;left:50%;transform:translateX(-50%);width:36px;height:3px;background:var(--grad-gold);border-radius:0 0 6px 6px;box-shadow:0 0 16px var(--gold)"></div>
    <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;filter:drop-shadow(0 0 8px rgba(212,175,55,.6))"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="11"/><circle cx="12" cy="8" r="1" fill="currentColor"/></svg>
    <span>Info</span>
  </a>
  <a href="fitur.html" class="bnav" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted-2);font-size:9.5px;font-weight:700;text-decoration:none;letter-spacing:.5px;text-transform:uppercase">
    <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span>Fitur</span>
  </a>
</div>

<div class="toast" id="toast"></div>

<script src="env.js"></script>
<script src="config.js"></script>
<script>
const me = SESSION.me;
if(!me) location.href = 'login.html';

let db = { users: {} };
let iklan = [];
let fotoBase64 = '';

function toast(m, err){const t=document.getElementById('toast');t.textContent=m;t.className='toast show '+(err?'err':'gold');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),2400);}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function isVer(u){try{return db.users[u]?.verified && db.users[u].verified.end > Date.now();}catch(e){return false;}}
function badgeSVG(){return '<svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:#d4af37"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>';}
function myRole(){ if(me==='ceomudaz') return 'Developer'; return db.users[me]?.role || 'User'; }
function canPost(){ const r = myRole(); return r === 'Developer' || r === 'Owner'; }
function canDelete(ik){ const r = myRole(); if(r === 'Developer') return true; return ik.by === me; }

document.getElementById('ikFoto').addEventListener('change', function(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      const max = 800; let w = img.width, h = img.height;
      if(w > h){ if(w > max){ h = h*max/w; w = max; } } else { if(h > max){ w = w*max/h; h = max; } }
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      fotoBase64 = c.toDataURL('image/jpeg', 0.75);
      const p = document.getElementById('previewPost');
      p.src = fotoBase64; p.style.display = 'block';
      document.getElementById('upText').textContent = '✅ Foto siap';
    };
    img.src = ev.target.result;
  };
  r.readAsDataURL(f);
});

async function init(){
  db = await readDB("database.json", { users: {} });
  const i = await readDB("iklan.json", { iklan: [] });
  iklan = i.iklan || [];

  document.getElementById('myBadge').innerHTML = myRole() === 'Developer'
    ? '<span class="chip chip-dev">DEV</span>'
    : myRole() === 'Owner'
      ? '<span class="chip chip-gold">OWN</span>'
      : '<span class="chip chip-silver">USER</span>';

  if(canPost()) document.getElementById('boxPost').classList.remove('hidden');
  renderIklan();
}

async function postIklan(){
  const j = document.getElementById('ikJudul').value.trim();
  const isi = document.getElementById('ikIsi').value.trim();
  const link = document.getElementById('ikLink').value.trim();
  if(!j || !isi) return toast('❌ Isi judul & isi iklan', true);

  iklan.unshift({
    id: Date.now(),
    judul: j, isi, link, foto: fotoBase64,
    by: me, role: myRole(), time: Date.now()
  });
  await writeDB("iklan.json", { iklan });

  cloneToTelegram("📢", "IKLAN BARU", [
    `📌 <b>${esc(j)}</b>`,
    `👤 @${me} (${myRole()})`,
    `📝 ${esc(isi).slice(0,300)}`
  ]);

  document.getElementById('ikJudul').value = '';
  document.getElementById('ikIsi').value = '';
  document.getElementById('ikLink').value = '';
  fotoBase64 = '';
  document.getElementById('previewPost').style.display = 'none';
  document.getElementById('upText').textContent = '📷 Tambah Foto (opsional)';
  renderIklan();
  toast('✅ Iklan terposting!');
}

async function deleteIklan(id){
  const ik = iklan.find(x => x.id === id);
  if(!canDelete(ik)) return toast('❌ Tidak bisa hapus', true);
  if(!confirm('Hapus iklan ini?')) return;
  iklan = iklan.filter(x => x.id !== id);
  await writeDB("iklan.json", { iklan });
  renderIklan();
}

function renderIklan(){
  const el = document.getElementById('listIklan');
  if(!iklan.length){ el.innerHTML = '<div class="legend">Belum ada iklan</div>'; return; }
  el.innerHTML = iklan.map(ik => {
    const cls = ik.role === 'Developer' ? 'dev' : 'own';
    const ver = isVer(ik.by) ? badgeSVG() : '';
    const canDel = canDelete(ik);
    return `<div class="iklan ${cls}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
        <div style="flex:1">
          <b style="font-size:14.5px;color:var(--text);display:flex;align-items:center;gap:5px">${esc(ik.judul)}${ver}</b>
          <div class="iklan-meta">
            <span class="chip ${ik.role==='Developer'?'chip-dev':'chip-gold'}">${ik.role}</span>
            <span>@${esc(ik.by)}</span>
            <span>•</span>
            <span>${new Date(ik.time).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span>
          </div>
        </div>
        ${canDel ? `<button class="del-btn" onclick="deleteIklan(${ik.id})">Hapus</button>` : ''}
      </div>
      ${ik.foto ? `<img src="${ik.foto}" style="width:100%;max-height:280px;object-fit:cover;border-radius:12px;margin-top:12px">` : ''}
      <div class="iklan-body">${esc(ik.isi)}</div>
      ${ik.link ? `<a href="${esc(ik.link)}" target="_blank" class="iklan-link">🔗 ${esc(ik.link)}</a>` : ''}
    </div>`;
  }).join('');
}

init();
window.addEventListener('focus', init);
</script></body></html>
