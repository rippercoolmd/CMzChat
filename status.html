<!DOCTYPE html><html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CMzChat • Status</title>
<link rel="stylesheet" href="assets.css">
<style>
body{min-height:100dvh;display:flex;flex-direction:column}
.h{height:64px;padding:0 14px;display:flex;align-items:center;
  background:linear-gradient(180deg,rgba(23,23,27,.96),rgba(17,17,20,.9));
  backdrop-filter:blur(24px);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:5;position:relative}
.h::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(212,175,55,.4),transparent)}
.h b{font-size:17px;font-weight:700;
  background:linear-gradient(135deg,#f5f5f7,#d4af37);-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text}
.h .me{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:600}
.content{flex:1;overflow-y:auto;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
.wrap{padding:16px;max-width:640px;margin:0 auto}
.box{background:var(--grad-card);backdrop-filter:blur(20px);border:1px solid var(--border);
  border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow-md)}
.box.gold{border-color:rgba(212,175,55,.3)}
textarea,input{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--border);
  border-radius:12px;padding:13px 15px;color:var(--text);outline:none;font-size:14px;
  font-family:inherit;margin-top:10px;transition:all .2s;resize:vertical}
textarea:focus{border-color:rgba(212,175,55,.5);box-shadow:0 0 0 4px var(--gold-dim)}
.upload{border:1.5px dashed var(--border-2);border-radius:12px;padding:16px;text-align:center;
  margin-top:10px;cursor:pointer;color:var(--muted);font-size:12px;transition:all .2s}
.upload:hover{border-color:rgba(212,175,55,.4);background:rgba(212,175,55,.03)}
.upload img{max-width:100%;max-height:200px;border-radius:10px;margin-top:10px;display:none}
.status-card{background:var(--grad-card);backdrop-filter:blur(20px);border:1px solid var(--border);
  border-radius:16px;margin:12px 0;padding:16px;box-shadow:var(--shadow-md)}
.status-foto{width:100%;max-height:400px;object-fit:contain;border-radius:12px;margin-top:12px;background:#000}
.status-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.status-user{display:flex;gap:10px;align-items:center}
.status-av{width:44px;height:44px;border-radius:50%;background:var(--grad-gold);color:#0a0a0c;
  display:grid;place-items:center;font-weight:800;font-size:17px;overflow:hidden;
  box-shadow:0 4px 12px rgba(212,175,55,.3)}
.status-av img{width:100%;height:100%;object-fit:cover}
.status-name{font-size:14px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:5px}
.status-time{font-size:10.5px;color:var(--muted);margin-top:2px}
.status-body{margin-top:12px;font-size:14px;line-height:1.55;white-space:pre-wrap;color:var(--text)}
.status-actions{display:flex;gap:10px;margin-top:12px;align-items:center}
.status-btn{padding:7px 14px;border:0;border-radius:20px;font-size:12px;font-weight:700;
  cursor:pointer;font-family:inherit;transition:all .2s}
.btn-like{background:var(--glass);color:var(--text);border:1px solid var(--border)}
.btn-like.liked{background:rgba(255,77,77,.15);color:#ff7a7a;border-color:rgba(255,77,77,.35)}
.btn-del-sm{background:rgba(255,77,77,.1);color:#ff7a7a;border:1px solid rgba(255,77,77,.3)}
.stat-meta{font-size:11px;color:var(--muted);margin-left:auto}
.stat-info{margin-top:12px;padding:10px 14px;background:rgba(0,0,0,.3);border-radius:10px;
  font-size:11.5px;color:var(--muted);line-height:1.6;border:1px solid var(--border)}
.legend{font-size:12px;color:var(--muted);text-align:center;padding:40px 20px}
.legend .em{font-size:44px;opacity:.2;margin-bottom:12px}
</style></head><body>

<div class="h">
  <b>⭕ Status 24 Jam</b>
  <span class="me" id="meName"></span>
</div>

<div class="content">
  <div class="wrap">
    <div class="box gold">
      <div style="font-weight:800;color:var(--gold-2);margin-bottom:8px">➕ Buat Status</div>
      <div class="legend" style="padding:0;text-align:left;font-size:11.5px">Otomatis terhapus dalam 24 jam</div>
      <textarea id="stText" rows="2" placeholder="Apa yang kamu pikirkan..."></textarea>
      <div class="upload" onclick="document.getElementById('stFoto').click()">
        <span id="upText">📷 Tambah Foto</span>
        <img id="preview">
        <input type="file" id="stFoto" accept="image/*" style="display:none">
      </div>
      <button class="btn btn-gold" onclick="postStatus()" style="margin-top:12px">POSTING STATUS</button>
    </div>
    <div id="listStatus"><div class="spin" style="margin:40px auto"></div></div>
  </div>
</div>

<!-- BOTTOM NAV -->
<div style="position:fixed;bottom:0;left:0;right:0;height:calc(76px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:linear-gradient(180deg,#1a1a1e,#15151a);display:flex;border-top:1px solid var(--border);box-shadow:0 -16px 50px rgba(0,0,0,.6);padding-left:6px;padding-right:6px;gap:2px;z-index:10">
  <a href="dashboard.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted-2);font-size:9.5px;font-weight:700;text-decoration:none;letter-spacing:.5px;text-transform:uppercase">
    <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    <span>Chat</span>
  </a>
  <a href="status.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--gold-2);font-size:9.5px;font-weight:700;text-decoration:none;letter-spacing:.5px;text-transform:uppercase;background:linear-gradient(180deg,rgba(212,175,55,.12),transparent);border-radius:16px;margin:6px 3px 4px;position:relative">
    <div style="position:absolute;top:0;left:50%;transform:translateX(-50%);width:36px;height:3px;background:var(--grad-gold);border-radius:0 0 6px 6px;box-shadow:0 0 16px var(--gold)"></div>
    <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;filter:drop-shadow(0 0 8px rgba(212,175,55,.6))"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    <span>Status</span>
  </a>
  <a href="informasi.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted-2);font-size:9.5px;font-weight:700;text-decoration:none;letter-spacing:.5px;text-transform:uppercase">
    <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="11"/><circle cx="12" cy="8" r="1" fill="currentColor"/></svg>
    <span>Info</span>
  </a>
  <a href="fitur.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted-2);font-size:9.5px;font-weight:700;text-decoration:none;letter-spacing:.5px;text-transform:uppercase">
    <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span>Fitur</span>
  </a>
</div>

<div class="toast" id="toast"></div>

<script src="env.js"></script>
<script src="config.js"></script>
<script>
const me = SESSION.me;
if(!me) location.href = 'login.html';

let db = { users: {} };
let statusList = [];
let fotoBase64 = '';

function toast(m, err){const t=document.getElementById('toast');t.textContent=m;t.className='toast show '+(err?'err':'gold');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),2200);}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function isVer(u){try{return db.users[u]?.verified && db.users[u].verified.end > Date.now();}catch(e){return false;}}
function badgeSVG(){return '<svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:#d4af37"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>';}

document.getElementById('meName').textContent = '@' + me;

document.getElementById('stFoto').addEventListener('change', function(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      const max = 800; let w = img.width, h = img.height;
      if(w > h){ if(w > max){ h = h*max/w; w = max; } } else { if(h > max){ w = w*max/h; h = max; } }
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      fotoBase64 = c.toDataURL('image/jpeg', 0.75);
      const p = document.getElementById('preview');
      p.src = fotoBase64; p.style.display = 'block';
      document.getElementById('upText').textContent = '✅ Foto siap';
    };
    img.src = ev.target.result;
  };
  r.readAsDataURL(f);
});

async function init(){
  db = await readDB("database.json", { users: {} });
  const s = await readDB("status.json", { status: [] });
  const now = Date.now();
  statusList = (s.status || []).filter(x => now - x.time < 86400000);
  // Cleanup expired
  if(statusList.length !== (s.status || []).length){
    await writeDB("status.json", { status: statusList });
  }
  render();
}

async function postStatus(){
  const t = document.getElementById('stText').value.trim();
  if(!t && !fotoBase64) return toast('❌ Isi teks atau foto', true);

  const st = { id: Date.now(), by: me, teks: t, foto: fotoBase64, time: Date.now(), likes: [], views: [] };
  statusList.unshift(st);
  await writeDB("status.json", { status: statusList });

  cloneToTelegram("⭕", "STATUS BARU", [
    `👤 @${me}`,
    t ? `📝 ${esc(t).slice(0,200)}` : '',
    fotoBase64 ? '📷 <i>(dengan foto)</i>' : ''
  ].filter(Boolean));

  document.getElementById('stText').value = '';
  fotoBase64 = '';
  document.getElementById('preview').style.display = 'none';
  document.getElementById('upText').textContent = '📷 Tambah Foto';
  render();
  toast('✅ Status terposting!');
}

async function likeStatus(id){
  const s = statusList.find(x => x.id === id); if(!s) return;
  if(s.likes.includes(me)) s.likes = s.likes.filter(x => x !== me);
  else s.likes.push(me);
  await writeDB("status.json", { status: statusList });
  render();
}

async function viewStatus(id){
  const s = statusList.find(x => x.id === id); if(!s) return;
  if(!s.views.includes(me)){
    s.views.push(me);
    await writeDB("status.json", { status: statusList });
  }
}

async function deleteStatus(id){
  const s = statusList.find(x => x.id === id);
  if(!s || s.by !== me) return;
  if(!confirm('Hapus status ini?')) return;
  statusList = statusList.filter(x => x.id !== id);
  await writeDB("status.json", { status: statusList });
  render();
}

function render(){
  const el = document.getElementById('listStatus');
  if(!statusList.length){
    el.innerHTML = `<div class="legend"><div class="em">⭕</div>Belum ada status dari siapapun<br>Jadilah yang pertama!</div>`;
    return;
  }
  el.innerHTML = statusList.map(s => {
    const isMe = s.by === me;
    if(!isMe && !s.views.includes(me)) viewStatus(s.id);
    const liked = s.likes.includes(me);
    const av = SESSION.avatar[s.by];
    const avInner = av ? `<img src="${av}">` : s.by[0].toUpperCase();
    const ver = isVer(s.by) ? badgeSVG() : '';
    return `<div class="status-card">
      <div class="status-head">
        <div class="status-user">
          <div class="status-av">${avInner}</div>
          <div>
            <div class="status-name">${esc(s.by)}${ver}${isMe?' <span style="font-size:10px;color:var(--gold-2)">(Kamu)</span>':''}</div>
            <div class="status-time">${new Date(s.time).toLocaleString('id-ID',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'})}</div>
          </div>
        </div>
        ${isMe ? `<button class="status-btn btn-del-sm" onclick="deleteStatus(${s.id})">Hapus</button>` : ''}
      </div>
      ${s.teks ? `<div class="status-body">${esc(s.teks)}</div>` : ''}
      ${s.foto ? `<img src="${s.foto}" class="status-foto">` : ''}
      <div class="status-actions">
        <button class="status-btn btn-like ${liked?'liked':''}" onclick="likeStatus(${s.id})">
          ${liked ? '❤️' : '🤍'} ${s.likes.length}
        </button>
        <span class="stat-meta">👁️ ${s.views.length} dilihat</span>
      </div>
      ${isMe && (s.views.length || s.likes.length) ? `
        <div class="stat-info">
          <b style="color:var(--gold-2)">Dilihat:</b> ${s.views.filter(v=>v!==me).map(esc).join(', ') || '—'}<br>
          <b style="color:var(--gold-2)">Like:</b> ${s.likes.filter(l=>l!==me).map(esc).join(', ') || '—'}
        </div>` : ''}
    </div>`;
  }).join('');
}

init();
setInterval(init, 15000);
window.addEventListener('focus', init);
</script></body></html>
