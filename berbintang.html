<!DOCTYPE html><html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CMzChat • Berbintang</title>
<link rel="stylesheet" href="assets.css">
<style>
body{min-height:100dvh}
.h{height:64px;padding:0 12px;display:flex;align-items:center;gap:10px;
  background:linear-gradient(180deg,rgba(23,23,27,.96),rgba(17,17,20,.9));
  backdrop-filter:blur(24px);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:5;position:relative}
.h::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(212,175,55,.4),transparent)}
.back{width:42px;height:42px;border:0;background:transparent;color:var(--silver);font-size:20px;
  border-radius:50%;cursor:pointer;display:grid;place-items:center}
.back:active{background:var(--glass-2)}
.h b{font-size:17px;font-weight:700;
  background:linear-gradient(135deg,#f5f5f7,#d4af37);-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text}
.wrap{padding:16px;max-width:640px;margin:0 auto}
.card{background:var(--grad-card);backdrop-filter:blur(20px);border:1px solid var(--border);
  border-radius:16px;padding:16px;margin-bottom:12px;
  border-left:3px solid var(--gold);box-shadow:var(--shadow-md)}
.card .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px}
.card .with{font-size:12.5px;color:var(--gold-2);font-weight:700}
.card .time{font-size:11px;color:var(--muted)}
.card .from{font-size:11px;color:var(--muted);margin-bottom:6px}
.card .text{font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word;color:var(--text)}
.btn-row{display:flex;gap:8px;margin-top:12px}
.btn-row button{padding:8px 16px;border:0;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-open{background:var(--gold-dim);color:var(--gold-2);border:1px solid rgba(212,175,55,.35)}
.btn-del{background:rgba(255,77,77,.1);color:#ff7a7a;border:1px solid rgba(255,77,77,.3)}
.empty{text-align:center;padding:80px 24px;color:var(--muted)}
.empty .em{font-size:56px;opacity:.2;margin-bottom:16px}
.empty b{display:block;font-size:15px;color:var(--text);margin-bottom:6px}
</style></head><body>
<div class="h">
  <button class="back" onclick="location.href='dashboard.html'">←</button>
  <b>⭐ Pesan Berbintang</b>
</div>
<div class="wrap"><div id="list"><div class="spin" style="margin-top:60px"></div></div></div>
<div class="toast" id="toast"></div>

<script src="env.js"></script>
<script src="config.js"></script>
<script>
const me = SESSION.me;
if(!me) location.href = 'login.html';

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.className='toast show gold';setTimeout(()=>t.classList.remove('show'),2200);}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

let starredArr = [];

async function loadStarred(){
  const db = await readDB("starred.json", { starred: {} });
  starredArr = db.starred?.[me] || [];
  render();
}

function render(){
  const el = document.getElementById('list');
  if(!starredArr.length){
    el.innerHTML = `<div class="empty"><div class="em">⭐</div><b>Belum ada pesan berbintang</b>Klik pesan di chat lalu pilih "Bintangi"</div>`;
    return;
  }
  el.innerHTML = starredArr.map((s, i) => `
    <div class="card">
      <div class="head">
        <div class="with">💬 dengan @${esc(s.chatWith || s.to || '?')}</div>
        <div class="time">${new Date(s.time).toLocaleString('id-ID')}</div>
      </div>
      <div class="from">Dari: @${esc(s.by)}</div>
      <div class="text">${esc(s.text)}</div>
      <div class="btn-row">
        <button class="btn-open" onclick="gotoChat('${esc(s.chatWith||s.to)}')">💬 Buka Chat</button>
        <button class="btn-del" onclick="unstar(${i})">🗑️ Hapus Bintang</button>
      </div>
    </div>
  `).join('');
}

async function unstar(i){
  starredArr.splice(i, 1);
  const db = await readDB("starred.json", { starred: {} });
  if(!db.starred) db.starred = {};
  db.starred[me] = starredArr;
  await writeDB("starred.json", db);
  render();
  toast('⭐ Bintang dihapus');
}

function gotoChat(u){
  if(!u) return;
  location.href = 'chat.html?u=' + encodeURIComponent(u);
}

loadStarred();
</script></body></html>
