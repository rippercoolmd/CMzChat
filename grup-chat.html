<!DOCTYPE html><html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>CMzChat • Grup</title>
<link rel="stylesheet" href="assets.css">
<style>
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column;background:#0a0a0c}
.h{flex-shrink:0;height:64px;padding:0 12px;display:flex;align-items:center;gap:12px;
  background:linear-gradient(180deg,rgba(23,23,27,.96),rgba(23,23,27,.88));
  backdrop-filter:blur(24px);border-bottom:1px solid var(--border);position:relative;z-index:5}
.h::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(212,175,55,.35),transparent)}
.back{width:42px;height:42px;border:0;background:transparent;color:var(--silver);font-size:22px;
  border-radius:50%;cursor:pointer;display:grid;place-items:center}
.back:active{background:var(--glass-2)}
.av{width:44px;height:44px;border-radius:50%;flex-shrink:0;
  background:var(--grad-gold);color:#0a0a0c;display:grid;place-items:center;font-size:20px;
  box-shadow:0 4px 14px rgba(212,175,55,.35)}
.info{flex:1;min-width:0}
.info b{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:700;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .sub{font-size:11.5px;color:var(--muted);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.lock{font-size:9px;padding:2px 7px;border-radius:7px;background:rgba(212,175,55,.15);
  color:var(--gold-2);font-weight:800;letter-spacing:.4px;border:1px solid rgba(212,175,55,.3)}
.msgs{flex:1;overflow-y:auto;padding:18px 14px 12px;display:flex;flex-direction:column;gap:2px;
  background:
    radial-gradient(circle at 30% 20%,rgba(212,175,55,.03) 0%,transparent 50%),
    radial-gradient(circle at 70% 80%,rgba(212,175,55,.02) 0%,transparent 50%),
    #0a0a0c}
.date-sep{text-align:center;margin:14px 0}
.date-sep span{background:rgba(30,30,35,.9);backdrop-filter:blur(10px);color:var(--muted);
  font-size:11px;padding:6px 14px;border-radius:14px;border:1px solid var(--border);font-weight:600}
.msg-row{display:flex;gap:8px;align-items:flex-end;margin:1px 0}
.msg-row.me{flex-direction:row-reverse}
.bubble{max-width:78%;padding:10px 14px 8px;border-radius:16px;font-size:14.5px;line-height:21px;
  word-wrap:break-word;white-space:pre-wrap;position:relative;
  box-shadow:0 2px 8px rgba(0,0,0,.25)}
.me .bubble{background:linear-gradient(135deg,#2a2a30,#1e1e23);
  border-top-right-radius:4px;border:1px solid rgba(212,175,55,.25)}
.other .bubble{background:linear-gradient(135deg,#1a1a1e,#15151a);
  border-top-left-radius:4px;border:1px solid var(--border)}
.sender{font-size:12px;font-weight:700;color:var(--gold-2);margin-bottom:4px;
  display:flex;align-items:center;gap:5px}
.t{font-size:10.5px;color:rgba(255,255,255,.5);float:right;margin:5px -3px -4px 10px;
  display:inline-flex;align-items:center;gap:3px}
.t .tick{color:var(--gold-2);font-size:12px;letter-spacing:-3px}
.msg-av{width:30px;height:30px;border-radius:50%;flex-shrink:0;overflow:hidden;
  background:linear-gradient(135deg,#2a2a30,#1a1a1e);
  display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--gold-2);
  border:1px solid var(--border)}
.msg-av img{width:100%;height:100%;object-fit:cover}
.msg-av.hide{visibility:hidden}
.msg-av.admin{border-color:rgba(212,175,55,.5);box-shadow:0 0 8px rgba(212,175,55,.4)}
.bar{flex-shrink:0;padding:12px 12px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(23,23,27,.9),rgba(23,23,27,.98));
  backdrop-filter:blur(24px);border-top:1px solid var(--border);
  display:flex;gap:10px;align-items:flex-end}
.inp-wrap{flex:1;background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:24px;
  display:flex;align-items:flex-end;padding:2px;transition:all .25s}
.inp-wrap:focus-within{border-color:rgba(212,175,55,.5);box-shadow:0 0 0 4px var(--gold-dim)}
textarea{flex:1;background:transparent;border:0;color:var(--text);outline:none;
  padding:12px 18px;font-size:14.5px;font-family:inherit;resize:none;
  max-height:120px;line-height:20px}
textarea::placeholder{color:var(--muted-2)}
.send{width:50px;height:50px;border-radius:50%;border:0;background:var(--grad-gold);color:#0a0a0c;
  font-size:18px;font-weight:700;cursor:pointer;display:grid;place-items:center;flex-shrink:0;
  box-shadow:0 8px 24px rgba(212,175,55,.4),inset 0 1px 0 rgba(255,255,255,.3);transition:all .2s}
.send:active{transform:scale(.9)}
.send:disabled{opacity:.4;cursor:not-allowed}
.empty{text-align:center;color:var(--muted);padding:80px 20px;font-size:13.5px}
.empty .em{font-size:52px;margin-bottom:14px;opacity:.25}
.crown{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:800;
  color:var(--gold-2);padding:2px 6px;border-radius:6px;
  background:rgba(212,175,55,.12);border:1px solid rgba(212,175,55,.3);letter-spacing:.3px}
</style></head><body>

<div class="h">
  <button class="back" onclick="location.href='grup.html'">←</button>
  <div class="av" id="grpAv">👥</div>
  <div class="info">
    <b id="grpName">Loading...</b>
    <div class="sub" id="grpSub">-</div>
  </div>
</div>

<div class="msgs" id="msgs"><div class="empty"><div class="em">💬</div>Memuat pesan...</div></div>

<div class="bar">
  <div class="inp-wrap"><textarea id="msgInput" placeholder="Ketik pesan..." rows="1"></textarea></div>
  <button class="send" id="btnSend" onclick="send()">➤</button>
</div>

<div class="toast" id="toast"></div>

<script src="env.js"></script>
<script src="config.js"></script>
<script>
const me = SESSION.me;
if(!me) location.href = 'login.html';

const params = new URLSearchParams(location.search);
const gid = params.get('id');
if(!gid){ location.href = 'grup.html'; }

let db = { users: {} };
let group = null;
let isGlobal = false;
let admins = [];
let lastCount = 0;
let sending = false;

function toast(m, err){
  const t = document.getElementById('toast');
  t.textContent = m;
  t.className = 'toast show ' + (err ? 'err' : 'gold');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove('show'), 2200);
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function avHTML(u){
  const a = SESSION.avatar[u];
  return a ? '<img src="' + a + '">' : u[0].toUpperCase();
}
function isAdmin(u){ return admins.includes(u); }

function fmtDate(ts){
  const d = new Date(ts), now = new Date();
  const dd = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const tt = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.round((tt - dd) / 86400000);
  if(diff === 0) return 'Hari ini';
  if(diff === 1) return 'Kemarin';
  return d.toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'});
}

async function init(){
  // Load user
  db = await readDB("database.json", { users: {} });

  // Sync avatars
  const av = await readDB("avatars.json", { avatars: {} });
  localStorage.setItem('cmz_avatars_v1', JSON.stringify(av.avatars || {}));

  // Pastikan Global ada
  await ensureGlobalGroup();

  // Baca groups
  let g = await readDB("groups.json", { groups: [] });
  if(!g.groups) g.groups = [];

  group = g.groups.find(x => x.id === gid);

  // SELF-HEALING: kalau gid=GLOBAL dan tidak ada → buat sekarang
  if(!group && gid === GLOBAL_ID){
    console.warn("[CMzChat] Global hilang, auto-create...");
    group = {
      id: GLOBAL_ID,
      name: "Global CMzChat",
      isGlobal: true,
      createdBy: "system",
      createdAt: 0,
      members: Object.keys(db.users || {})
    };
    g.groups.unshift(group);
    await writeDB("groups.json", g);
    await new Promise(r => setTimeout(r, 500));
    const g2 = await readDB("groups.json", { groups: [] });
    group = (g2.groups || []).find(x => x.id === GLOBAL_ID) || group;
  }

  // Masih tidak ada → balik
  if(!group){
    alert('Grup tidak ditemukan');
    location.href = 'grup.html';
    return;
  }

  isGlobal = !!group.isGlobal;
  admins = getGroupAdmins(group, db);

  // Access check
  if(isGlobal){
    if(!db.users?.[me]){
      alert('Akun tidak valid');
      location.href = 'login.html';
      return;
    }
  } else {
    if((group.members || []).indexOf(me) < 0){
      alert('Kamu bukan anggota grup ini');
      location.href = 'grup.html';
      return;
    }
  }

  // Render header
  if(isGlobal){
    document.getElementById('grpName').innerHTML = esc(group.name) + ' <span class="lock">🔒 GLOBAL</span>';
    document.getElementById('grpAv').innerHTML = '🌐';
    document.getElementById('grpSub').innerHTML =
      '👑 Admin: ' + admins.map(a => '@' + a).join(', ') + ' • ' + Object.keys(db.users).length + ' anggota';
  } else {
    document.getElementById('grpName').textContent = group.name;
    document.getElementById('grpAv').innerHTML = '👥';
    document.getElementById('grpSub').textContent =
      group.members.length + ' anggota • dibuat @' + group.createdBy;
  }

  load();
}

async function load(){
  const dbm = await readDB("group_msgs.json", { msgs: {} });
  const arr = (dbm.msgs && dbm.msgs[gid]) || [];
  render(arr);
}

function render(arr){
  const el = document.getElementById('msgs');
  if(!arr.length){
    el.innerHTML = '<div class="empty"><div class="em">✨</div>Belum ada pesan.<br>Jadi yang pertama!</div>';
    lastCount = 0;
    return;
  }
  let html = '';
  let prevBy = null, prevDate = null;
  arr.forEach(function(m){
    const dl = fmtDate(m.time);
    if(dl !== prevDate){
      html += '<div class="date-sep"><span>' + dl + '</span></div>';
      prevDate = dl;
      prevBy = null;
    }
    const isMe = m.by === me;
    const t = new Date(m.time).toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
    const isFirst = prevBy !== m.by;
    const admin = isAdmin(m.by);
    const adminBadge = admin ? ' <span class="crown">👑 ADMIN</span>' : '';

    const avRow = isMe
      ? '<div class="msg-av hide"></div>'
      : (isFirst
          ? '<div class="msg-av ' + (admin ? 'admin' : '') + '">' + avHTML(m.by) + '</div>'
          : '<div class="msg-av hide"></div>');

    const senderHTML = (!isMe && isFirst)
      ? '<div class="sender">' + esc(m.by) + adminBadge + '</div>'
      : '';

    html += '<div class="msg-row ' + (isMe ? 'me' : 'other') + '">' +
      avRow +
      '<div class="bubble">' + senderHTML + esc(m.text) + '<span class="t">' + t + (isMe ? ' <span class="tick">✓✓</span>' : '') + '</span></div>' +
    '</div>';
    prevBy = m.by;
  });
  el.innerHTML = html;
  if(lastCount !== arr.length) requestAnimationFrame(function(){ el.scrollTop = el.scrollHeight; });
  lastCount = arr.length;
}

async function send(){
  if(sending) return;
  const inp = document.getElementById('msgInput');
  const txt = inp.value.trim();
  if(!txt) return;

  sending = true;
  document.getElementById('btnSend').disabled = true;
  inp.value = '';
  autoResize();

  const msg = { by: me, text: txt, time: Date.now(), role: (db.users && db.users[me] && db.users[me].role) || 'User' };

  const dbm = await readDB("group_msgs.json", { msgs: {} });
  if(!dbm.msgs) dbm.msgs = {};
  if(!dbm.msgs[gid]) dbm.msgs[gid] = [];
  dbm.msgs[gid].push(msg);
  if(dbm.msgs[gid].length > 500) dbm.msgs[gid] = dbm.msgs[gid].slice(-500);
  render(dbm.msgs[gid]);

  const ok = await writeDB("group_msgs.json", dbm);
  if(!ok) toast("Gagal kirim", true);

  cloneToTelegram("👥", isGlobal ? "PESAN GLOBAL" : "PESAN GRUP", [
    "📛 " + (isGlobal ? "🌐 Global" : esc(group.name)),
    "👤 @" + me + (isAdmin(me) ? ' 👑' : ''),
    "💬 " + esc(txt).slice(0, 300)
  ]);

  sending = false;
  document.getElementById('btnSend').disabled = false;
  setTimeout(load, 800);
}

const inp = document.getElementById('msgInput');
function autoResize(){ inp.style.height = 'auto'; inp.style.height = Math.min(inp.scrollHeight, 120) + 'px'; }
inp.addEventListener('input', autoResize);
inp.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});

init();
setInterval(load, 4000);
setTimeout(function(){ inp.focus(); }, 300);
</script></body></html>
